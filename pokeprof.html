<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background:#1a1a2e; color:#e0e0e0; font-family:'Courier New',monospace; font-size:13px; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  #header { background:#16213e; border-bottom:2px solid #e63946; padding:8px 12px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  #header h1 { font-size:15px; color:#e63946; letter-spacing:2px; text-transform:uppercase; }
  .funds { font-size:14px; color:#f4d03f; font-weight:bold; }
  .income-rate { font-size:10px; color:#9090b0; }
  #save-indicator { font-size:10px; color:#555; text-align:right; }
  #save-indicator.saving { color:#2ecc71; }
  #save-indicator.error { color:#e63946; }

  #offline-banner { display:none; background:#1a3a1a; border-bottom:1px solid #2ecc71; padding:10px 14px; flex-shrink:0; }
  #offline-banner .ob-title { color:#2ecc71; font-weight:bold; font-size:12px; margin-bottom:4px; }
  #offline-banner .ob-body { color:#a0c0a0; font-size:11px; line-height:1.6; }

  #tab-bar { display:flex; background:#0f3460; border-bottom:1px solid #1a4a80; flex-shrink:0; }
  .tab-btn { flex:1; padding:10px 4px; text-align:center; font-family:'Courier New',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#6080a0; background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; }
  .tab-btn.active { color:#e0e0e0; border-bottom-color:#e63946; }
  .tab-icon { display:block; font-size:16px; margin-bottom:2px; }

  #panels { flex:1; overflow:hidden; }
  .panel { display:none; flex-direction:column; height:100%; overflow:hidden; }
  .panel.active { display:flex; }
  .panel-title { background:#0f3460; padding:6px 12px; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#a0a0c0; flex-shrink:0; }

  #aide-info { padding:10px 12px; border-bottom:1px solid #0f3460; background:#16213e; flex-shrink:0; }
  #aide-info .aide-name { color:#e63946; font-size:14px; margin-bottom:3px; }
  #aide-info .aide-location { color:#a0a0c0; font-size:11px; }

  #party-list { overflow-y:auto; flex:1; padding:8px; background:#16213e; }
  .party-slot { background:#0f3460; border:1px solid #1a4a80; border-radius:6px; padding:10px; margin-bottom:8px; }

  .party-slot .poke-name { font-size:13px; color:#fff; margin-bottom:3px; }
  .party-slot .poke-level { color:#a0c4ff; font-size:11px; margin-bottom:4px; }
  .hp-bar-wrap { background:#0a0a1a; border-radius:3px; height:7px; margin:5px 0 3px; overflow:hidden; }
  .hp-bar { height:100%; border-radius:3px; transition:width 0.3s; }
  .hp-text { font-size:10px; color:#a0a0c0; }
  .exp-bar-wrap { background:#0a0a1a; border-radius:3px; height:3px; margin-top:5px; overflow:hidden; }
  .exp-bar { height:100%; background:#9b59b6; border-radius:3px; }

  #controls { background:#16213e; border-top:1px solid #0f3460; padding:10px 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex-shrink:0; }

  button { background:#0f3460; color:#e0e0e0; border:1px solid #1a4a80; border-radius:4px; padding:8px 14px; font-family:'Courier New',monospace; font-size:11px; cursor:pointer; letter-spacing:1px; text-transform:uppercase; transition:background 0.15s; }
  button:active { background:#1a4a80; }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  button.danger { border-color:#e63946; color:#e63946; }
  button.danger:active { background:#3a1020; }
  button.primary { border-color:#2ecc71; color:#2ecc71; }
  button.primary:active { background:#0a3020; }
  button.reset { border-color:#555; color:#777; font-size:10px; padding:5px 10px; }

  #encounter-display { background:#0f3460; border-bottom:1px solid #1a4a80; padding:10px 12px; flex-shrink:0; }
  .enc-title { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#a0a0c0; margin-bottom:4px; }
  .enc-body { font-size:12px; color:#e0e0e0; min-height:18px; }

  #log { overflow-y:auto; flex:1; padding:8px; }
  .log-entry { padding:4px 6px; border-bottom:1px solid #0a0f1a; font-size:11px; color:#8090a0; }
  .log-entry.catch { color:#2ecc71; }
  .log-entry.evolve { color:#f4d03f; }
  .log-entry.damage { color:#e74c3c; }
  .log-entry.win { color:#3498db; }
  .log-entry.faint { color:#e63946; }
  .log-entry.fail { color:#e67e22; }
  .log-entry.exp { color:#9b59b6; }
  .log-entry.info { color:#5dade2; }

  #panel-dex { display:none; flex-direction:column; height:100%; overflow:hidden; }
  #panel-dex.active { display:flex; }
  #dex-stats { background:#0f3460; padding:6px 12px; font-size:10px; color:#a0a0c0; display:flex; gap:12px; flex-shrink:0; border-bottom:1px solid #1a4a80; }
  #dex-stats span { color:#e0e0e0; }
  .dex-entry { background:#0f3460; border:1px solid #1a4a80; border-radius:6px; padding:10px; margin-bottom:6px; }
  .dex-entry.unassigned { opacity:0.7; }
  .dex-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; }
  .dex-name { font-size:12px; color:#fff; }
  .dex-id { font-size:10px; color:#6080a0; }
  .dex-details { font-size:10px; color:#a0a0c0; }
  .dex-holder { font-size:10px; color:#5dade2; margin-top:2px; }
  .shiny-badge { color:#f4d03f; font-size:10px; margin-left:4px; }
  .aide-party-sprites { display:inline-flex; gap:4px; vertical-align:middle; margin-left:6px; }
  .aide-sprite-mini { width:28px; height:28px; }
  .party-sprite { width:112px; height:112px; image-rendering:pixelated; }

  #panel-map { display:none; flex-direction:column; height:100%; overflow:hidden; }
  #panel-map.active { display:flex; }

  #bag-display { background:#16213e; border-bottom:1px solid #0f3460; padding:6px 12px; font-size:10px; color:#a0a0c0; flex-shrink:0; }
</style>

<div id="header">

  <!-- PARTY TAB -->
  <div class="panel active" id="panel-party">
    <div id="aide-info">
      <div class="aide-name">🧑‍🔬 Carl Oak</div>
      <div class="aide-location" id="aide-location">📍 Pallet Town — Idle</div>
      <div id="aide-bag-display" style="font-size:10px;color:#6080a0;margin-top:2px;"></div>
      <div id="bag-display" style="display:none;"></div>
      <div id="aide-bag-items" style="font-size:10px;color:#a0a0c0;margin-top:2px;"></div>
    </div>

        <option value="all">All</option>

<script>
// ── SPECIES LOOKUP ──
const SPECIES = {};
if(typeof POKEDEX_DATA !== 'undefined'){
  POKEDEX_DATA.forEach(p => {
    const existing = SPECIES[p.name];
    if(!p.formName){
      if(!existing || p.growthRate) SPECIES[p.name] = p;
    } else {
      if(!existing) SPECIES[p.name] = p;
    }
  });
}

// ── POKEDEX ENTRY HELPER ──
// Prefers formName===null; falls back to first entry with that dexId.
// Required for form-only species like Nidoran M/F where every entry has a non-null formName.
function getPokemonEntry(dexId){
  if(typeof POKEDEX_DATA==='undefined') return null;
  const nullForm = POKEDEX_DATA.find(x=>x.dexId===dexId&&x.formName===null);
  if(nullForm) return nullForm;
  return POKEDEX_DATA.find(x=>x.dexId===dexId) || null;
}

// ── ENCOUNTER METHODS ──
const EVOLUTION_METHODS = [
  'level','friendship','friendship-day','friendship-night','use-move',
  'Moon Stone','Thunder Stone','Fire Stone','Leaf Stone','Water Stone',
  'Sun Stone','Shiny Stone','Dusk Stone','Dawn Stone','Ice Stone',
  'Oval Stone','Metal Coat','Protector','Dragon Scale','Electirizer',
  'Up Grade','Dubious Disc','Razor Fang','Razor Claw','Peat Block',
  'Reaper Cloth','Deep Sea Tooth','Sachet','Whipped Dream','Tart Apple',
  'Cracked Pot','Metal Alloy','Auspicious Armor','Unremarkable Teacup','Link Cable'
];

// ── ENCOUNTER TABLE ──
// v0.21 — scoped fix: fishing splits into per-rod-tier sub-methods so each rod can be
// independently checked/unchecked in the mission modal (e.g. turning off Old Rod's guaranteed
// Lv5 Magikarp without losing Good/Super Rod encounters). No other encounterMethod is affected.
const FISH_ROD_SUBMETHODS={oldRod:'fish-old',goodRod:'fish-good',superRod:'fish-super'};
const FISH_ROD_LABELS={'fish-old':'Old Rod','fish-good':'Good Rod','fish-super':'Super Rod'};
function getEncounterSubMethod(method,requiresItem){
  if(method==='fish'&&requiresItem&&FISH_ROD_SUBMETHODS[requiresItem]) return FISH_ROD_SUBMETHODS[requiresItem];
  return method;
}

function buildRouteTable(locationId){
  if(typeof ENCOUNTERS==='undefined'||!ENCOUNTERS.length) return [];
  return ENCOUNTERS
    .filter(e=>e.locationId===locationId)
    .filter(e=>{
      if(!e.requiresItem) return true;
      return !!(state.trainerBag&&state.trainerBag[e.requiresItem]&&state.trainerBag[e.requiresItem]>0);
    })
    .map(e=>({dexId:e.dexId,minLv:e.minLevel,maxLv:e.maxLevel,weight:e.encounterRate,method:getEncounterSubMethod(e.encounterMethod||'grass',e.requiresItem),requiresItem:e.requiresItem||null}));
}

const ENC_INTERVAL = 30;
const FRIENDSHIP_THRESHOLD = 220;
// v0.22 — highest level-based evolution across the whole franchise is Zweilous->Hydreigon
// at level 64; 65 clears it with the minimum safe margin. Used to rule out 'level' as a
// species' evolution method once an individual has clearly passed any plausible trigger level.
const LEVEL_RULEOUT_THRESHOLD = 65;

// ── UNIT CONVERSION HELPERS ──
function metersToFeetStr(m){
  if(m===null||m===undefined||isNaN(m)) return null;
  const totalInches = m * 39.3701;
  const feet = Math.floor(totalInches / 12);
  const inches = Math.round(totalInches % 12);
  return feet+"'"+inches+'"';
}
function kgToLbsStr(kg){
  if(kg===null||kg===undefined||isNaN(kg)) return null;
  return (kg*2.20462).toFixed(1)+' lbs';
}

// ── ITEM HELPERS ──
function getItem(itemId){
  if(typeof ITEMS_DATA==='undefined') return null;
  return ITEMS_DATA.find(i=>i.itemId===itemId)||null;
}

function getBallCount(){
  if(!state.professorBag) return 0;
  let total=0;
  Object.entries(state.professorBag).forEach(([id,qty])=>{
    const item=getItem(id);
    if(item&&item.itemCategory==='ball') total+=qty;
  });
  return total;
}

// Potion selection: smallest potion that can be used with 100% efficiency (no waste).
// No HP threshold — use whenever not at full HP and a valid potion exists.
// Max Potion only used when missing more than 120 HP.
function getWeakestEffectivePotion(pokemon){
  if(!state.professorBag||!pokemon) return null;
  const missing=pokemon.maxHP-pokemon.currentHP;
  if(missing<=0) return null;
  const potions=[
    {id:'potion',        heal:20},
    {id:'super-potion',  heal:60},
    {id:'hyper-potion',  heal:120},
    {id:'max-potion',    heal:Infinity},
  ];
  for(const p of potions){
    if((state.professorBag[p.id]||0)<=0) continue;
    if(p.id==='max-potion'){
      if(missing>120) return p.id;
    } else {
      if(p.heal<=missing) return p.id;
    }
  }
  return null;
}

// Canonical item use function — always call this, never inline item effects.
// Logs every heal and revive.
function useItemFromBag(itemId, pokemon){
  if(!state.professorBag||!state.professorBag[itemId]) return false;
  const item=getItem(itemId);
  if(!item) return false;
  if(item.itemCategory==='ball'){
    state.professorBag[itemId]--;
    if(state.professorBag[itemId]<=0) delete state.professorBag[itemId];
    return true;
  }
  if(item.effect==='evolve-stone'||item.effect==='evolve-trade'){
    // Consumed by applyItemEvolution — not handled here
    return false;
  }
  if(!pokemon) return false;
  if(item.effect==='heal-hp'){
    const heal=parseInt(item.effectValue)||20;
    const healed=Math.min(heal,pokemon.maxHP-pokemon.currentHP);
    pokemon.currentHP=Math.min(pokemon.maxHP,pokemon.currentHP+heal);
    addLog(item.name+' used on '+getDisplayName(pokemon)+': +'+healed+' HP ('+pokemon.currentHP+'/'+pokemon.maxHP+')','info');
  } else if(item.effect==='heal-hp-full'){
    const healed=pokemon.maxHP-pokemon.currentHP;
    pokemon.currentHP=pokemon.maxHP;
    addLog(item.name+' used on '+getDisplayName(pokemon)+': +'+healed+' HP (full)','info');
  } else if(item.effect==='revive-half'){
    pokemon.currentHP=Math.floor(pokemon.maxHP/2);
    addLog(item.name+' used: '+getDisplayName(pokemon)+' revived to '+pokemon.currentHP+' HP','info');
  } else if(item.effect==='revive-full'){
    pokemon.currentHP=pokemon.maxHP;
    addLog(item.name+' used: '+getDisplayName(pokemon)+' fully revived','info');
  }
  state.professorBag[itemId]--;
  if(state.professorBag[itemId]<=0) delete state.professorBag[itemId];
  return true;
}

// ── STATE ──
let state={
  funds:5.00, totalCatches:0, totalSightings:0,
  missionActive:false, missionElapsed:0, nextEncounterIn:ENC_INTERVAL,
  incomeAccumulator:0,
  party:[], dex:[], dexIdCounter:1, currentEncounter:null, log:[],
  missionDestination:'route1', missionBehavior:'research',
  missionOrigin:'palletTown', currentLocation:'palletTown', autoRepeat:false,
  travelPath:[], travelPathIndex:0, travelCyclesRemaining:0,
  professorBag:{},
  trainerBag:{},
  researchLog:{}, pendingFindings:[],
  discoveredLocations:new Set(['palletTown']),
  locationEncounterLog:{},
  locationMethodPrefs:{},
  lastHealLocation:'palletTown',
  dexHistory:{}
};

// ── MAKE POKEMON ──
// isShiny is NOT rolled here — it is set explicitly at the call site when a shiny is confirmed.
// dexId is optional — pass it whenever the caller already knows the exact database row
// (e.g. from rollEncounter()). Never re-derive a known dexId from the species name string,
// since some names (Nidoran M/F) map to multiple distinct rows.
function makePokemon(sp,lv,gender,holder=null,dexId=null){
  let entry=null;
  if(dexId){
    entry=getPokemonEntry(dexId);
  }
  if(!entry&&typeof POKEDEX_DATA!=='undefined'){
    entry=POKEDEX_DATA.find(p=>p.name===sp&&p.formName===null&&p.growthRate);
    if(!entry) entry=POKEDEX_DATA.find(p=>p.name===sp&&p.growthRate);
    if(!entry) entry=POKEDEX_DATA.find(p=>p.name===sp&&p.formName===null);
    if(!entry) entry=POKEDEX_DATA.find(p=>p.name===sp);
  }
  if(!entry) entry=SPECIES[sp];
  const resolvedDexId=dexId||(entry?entry.dexId||entry.id:0);
  const growthRate=(entry&&entry.growthRate)||'mediumFast';
  const maxHP=calcMaxHP(sp,lv,resolvedDexId);
  const startExp=expToLevel(lv,growthRate);
  const ability=assignAbility(entry);
  return{
    id:state.dexIdCounter++, species:sp, pokedexId:resolvedDexId, level:lv, gender,
    currentHP:maxHP, maxHP, growthRate,
    exp:isNaN(startExp)?0:startExp,
    holder,
    isShiny:false,
    ability:ability||null,
    friendship:0,
    nickname:null,
    evolveBlocked:false
  };
}

// Returns the nickname if set, otherwise the species name. Use this at every
// instance-level display/log site — species-wide displays (cards, tables) keep p.species.
function getDisplayName(p){
  return (p&&p.nickname)?p.nickname:(p?p.species:'');
}

// ── SPRITES ──
const SPRITE_BASE='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon';
function getSpriteUrl(dexId,name,isShiny=false){
  if(!dexId||dexId===0) return '';
  if(typeof POKEDEX_DATA!=='undefined'){
    const entry=getPokemonEntry(dexId);
    if(entry&&entry.spriteUrl) return entry.spriteUrl;
  }
  return (isShiny?SPRITE_BASE+'/shiny':SPRITE_BASE)+'/'+dexId+'.png';
}

// ── PARTY SORT ──
// Lowest level leads; fainted go to back; ties preserved by inertia.
function sortParty(){
  state.party.sort((a,b)=>{
    const aFainted=a.currentHP<=0?1:0;
    const bFainted=b.currentHP<=0?1:0;
    if(aFainted!==bFainted) return aFainted-bFainted;
    return a.level-b.level;
  });
}

// ── TRAVEL ──
// BFS pathfinding — restricted to discovered locations only (prevents routing through undiscovered waypoints).
function buildTravelPath(fromId,toId){
  if(typeof CONNECTIONS_DATA!=='undefined'){
    const visited=new Set([fromId]);
    const queue=[[fromId,[]]];
    while(queue.length){
      const [cur,path]=queue.shift();
      const available=(CONNECTIONS_DATA||[]).filter(c=>{
        if(c.fromLocationId!==cur) return false;
        // Must be a discovered location
        if(!state.discoveredLocations.has(c.toLocationId)) return false;
        if(!c.requiresItem) return true;
        return (state.trainerBag&&state.trainerBag[c.requiresItem]&&state.trainerBag[c.requiresItem]>0)||
               (state.trainerUnlocks&&state.trainerUnlocks[c.requiresItem]);
      });
      for(const conn of available){
        const n=conn.toLocationId;
        if(visited.has(n)) continue;
        visited.add(n);
        const newPath=[...path,n];
        if(n===toId) return newPath;
        queue.push([n,newPath]);
      }
    }
    return [];
  }
  if(typeof CONNECTIONS!=='undefined'&&typeof getConnectedLocations==='function'){
    const visited=new Set([fromId]);
    const queue=[[fromId,[]]];
    while(queue.length){
      const [cur,path]=queue.shift();
      const neighbors=getConnectedLocations(cur)||[];
      for(const n of neighbors){
        if(visited.has(n)) continue;
        if(!state.discoveredLocations.has(n)) continue;
        visited.add(n);
        const newPath=[...path,n];
        if(n===toId) return newPath;
        queue.push([n,newPath]);
      }
    }
  }
  return [toId];
}

// BFS to find all discovered locations reachable from fromId (respecting requiresItem against trainerBag).
function getReachableDiscoveredLocations(fromId){
  const reachable=[];
  if(typeof CONNECTIONS_DATA==='undefined') return reachable;
  const visited=new Set([fromId]);
  const queue=[fromId];
  while(queue.length){
    const cur=queue.shift();
    const available=(CONNECTIONS_DATA||[]).filter(c=>{
      if(c.fromLocationId!==cur) return false;
      if(!c.requiresItem) return true;
      return (state.trainerBag&&state.trainerBag[c.requiresItem]&&state.trainerBag[c.requiresItem]>0)||
             (state.trainerUnlocks&&state.trainerUnlocks[c.requiresItem]);
    });
    for(const conn of available){
      const n=conn.toLocationId;
      if(visited.has(n)) continue;
      visited.add(n);
      if(state.discoveredLocations.has(n)) reachable.push(n);
      queue.push(n);
    }
  }
  return reachable;
}

function arriveAtLocation(locId){
  state.currentLocation=locId;
  const locData=typeof LOCATIONS!=='undefined'?getLocation(locId):null;
  const locName=locData?locData.name:locId;
  addLog('📍 Carl Oak arrived at '+locName+'!','info');

  // Update lastHealLocation and heal party only at locations with heals:true
  if(locData&&(locData.heals==='TRUE'||locData.heals===true||locData.heals==='true')){
    state.lastHealLocation=locId;
    const needsHeal=state.party.some(p=>p.currentHP<p.maxHP||p.currentHP<=0);
    if(needsHeal){
      state.party.forEach(p=>{ p.currentHP=p.maxHP; });
      addLog('🏥 Party healed at '+locName+'!','info');
    }
  }

  // travelTime = encounter-cycles to pass through this location as a waypoint
  const cycles=locData&&locData.travelTime?parseInt(locData.travelTime):1;
  state.travelCyclesRemaining=Math.max(1,cycles);

  // Discover ALL adjacent locations regardless of requiresItem
  if(typeof CONNECTIONS_DATA!=='undefined'){
    (CONNECTIONS_DATA||[]).forEach(conn=>{
      if(conn.fromLocationId===locId){
        if(!state.discoveredLocations.has(conn.toLocationId)){
          state.discoveredLocations.add(conn.toLocationId);
          const newLoc=typeof LOCATIONS!=='undefined'?getLocation(conn.toLocationId):null;
          addLog('🗺️ New area discovered: '+(newLoc?newLoc.name:conn.toLocationId)+'!','info');
        }
      }
    });
  }

  if(document.getElementById('panel-map').classList.contains('active')) renderMap();
}

function advanceTravelPath(){
  if(!state.travelPath||state.travelPath.length===0) return;
  if(state.travelPathIndex>=state.travelPath.length) return;
  state.travelCyclesRemaining--;
  if(state.travelCyclesRemaining<=0){
    state.travelPathIndex++;
    if(state.travelPathIndex<state.travelPath.length){
      arriveAtLocation(state.travelPath[state.travelPathIndex]);
    } else {
      state.currentLocation=state.missionDestination;
      const locData=typeof LOCATIONS!=='undefined'?getLocation(state.missionDestination):null;
      addLog('🏁 Carl Oak reached '+(locData?locData.name:state.missionDestination)+'!','info');
    }
  }
}

// ── ABILITY ASSIGNMENT ──
function assignAbility(entry){
  if(!entry) return null;
  const roll=Math.random();
  if(roll<0.45&&entry.ability1) return entry.ability1;
  if(roll<0.90&&entry.ability2) return entry.ability2;
  if(entry.hiddenAbility) return entry.hiddenAbility;
  if(entry.ability1) return entry.ability1;
  return null;
}

// ── EXP / LEVEL ──
function expToLevel(lv,r){
  if(lv<=1) return 0;
  if(r==='mediumFast') return Math.floor(Math.pow(lv,3));
  if(r==='mediumSlow') return Math.max(0,Math.floor((6/5)*Math.pow(lv,3)-(15*Math.pow(lv,2))+(100*lv)-140));
  if(r==='fast') return Math.floor((4*Math.pow(lv,3))/5);
  if(r==='slow') return Math.floor((5*Math.pow(lv,3))/4);
  if(r==='erratic') return lv<50?Math.floor((Math.pow(lv,3)*(100-lv))/50):lv<68?Math.floor((Math.pow(lv,3)*(150-lv))/100):lv<98?Math.floor((Math.pow(lv,3)*Math.floor((1911-10*lv)/3))/500):Math.floor((Math.pow(lv,3)*(160-lv))/100);
  if(r==='fluctuating') return lv<15?Math.floor((Math.pow(lv,3)*(Math.floor((lv+1)/3)+24))/50):lv<36?Math.floor((Math.pow(lv,3)*(lv+14))/50):Math.floor((Math.pow(lv,3)*(Math.floor(lv/2)+32))/50);
  return Math.floor(Math.pow(lv,3));
}

function calcMaxHP(sp,lv,dexId=null){
  const s=dexId?getPokemonEntry(dexId):SPECIES[sp]; if(!s) return lv+10;
  return Math.floor((s.baseHP*2*lv)/100)+lv+10;
}

function calcBST(sp,lv,dexId=null){
  const s=dexId?getPokemonEntry(dexId):SPECIES[sp]; if(!s) return 0;
  const st=(b)=>Math.floor(((b||0)*2*lv)/100)+5;
  return calcMaxHP(sp,lv,dexId)+st(s.baseAtk)+st(s.baseDef)+st(s.baseSpatk)+st(s.baseSpdef)+st(s.baseSpd);
}

// ── RESEARCH ──
function getResearch(dexId){
  if(!state.researchLog[dexId]) state.researchLog[dexId]={
    evolutionConfirmed:false, nonEvolutionConfirmed:false,
    confirmedBranches:[], // v0.20 — [{method,intoId}], replaces confirmedMethod/confirmedIntoId
    testedMethods:[], highestLevelObserved:0,
    abilitiesObserved:{}, // v0.20 — {ability1:true, ability2:true, hiddenAbility:true}
    knownSince:Date.now()
  };
  return state.researchLog[dexId];
}
function recordSighting(dexId,level){
  const r=getResearch(dexId);
  if(level>r.highestLevelObserved) r.highestLevelObserved=level;
}
// v0.22 — rules out level/friendship as a species' evolution method once an individual has
// clearly passed the highest plausible trigger for that method without evolving. Checked inline
// against the specific Pokemon that just changed (no full-roster rescan needed — level and
// friendship only ever increase). Safe no-op if already tested (confirmed or ruled out).
function checkMethodRuleOut(dexId,level,friendship){
  if(!dexId) return;
  const r=getResearch(dexId);
  if(level!=null&&level>=LEVEL_RULEOUT_THRESHOLD&&!r.testedMethods.includes('level')){
    r.testedMethods.push('level');
  }
  if(friendship!=null&&friendship>=FRIENDSHIP_THRESHOLD){
    ['friendship','friendship-day','friendship-night'].forEach(m=>{
      if(!r.testedMethods.includes(m)) r.testedMethods.push(m);
    });
  }
}
// Records one confirmed evolution branch for a species. A species can accumulate
// multiple confirmed branches (e.g. Eevee: Water Stone AND Thunder Stone both confirmed).
function recordEvolution(fromDexId,toDexId,method,level){
  const r=getResearch(fromDexId);
  const already=r.confirmedBranches.some(b=>b.method===method&&b.intoId===toDexId);
  if(!already){
    r.evolutionConfirmed=true;
    r.confirmedBranches.push({method,intoId:toDexId});
    if((method==='level'||method==='friendship'||method==='friendship-day'||method==='friendship-night')&&!r.testedMethods.includes(method)){
      r.testedMethods.push(method);
    }
    const fromEntry=getPokemonEntry(fromDexId);
    const toEntry=getPokemonEntry(toDexId);
    addFinding('evolution',fromEntry?fromEntry.name:'#'+fromDexId,toEntry?toEntry.name:'#'+toDexId,method,level);
  }
}
// Records that a given ability slot has been observed at least once for a species.
// Persists independently of held-Pokemon state — survives releases/cap overflow.
function recordAbilityObserved(dexId,abilityName){
  if(!abilityName) return;
  const entry=getPokemonEntry(dexId);
  if(!entry) return;
  const r=getResearch(dexId);
  if(entry.ability1&&entry.ability1===abilityName) r.abilitiesObserved.ability1=true;
  if(entry.ability2&&entry.ability2===abilityName) r.abilitiesObserved.ability2=true;
  if(entry.hiddenAbility&&entry.hiddenAbility===abilityName) r.abilitiesObserved.hiddenAbility=true;
}
// True once every non-null ability slot the species has has been observed.
function isDexPageComplete(dexId){
  const entry=getPokemonEntry(dexId);
  if(!entry) return false;
  const r=state.researchLog[dexId];
  if(!r) return false;
  if((r.testedMethods.length||0)<34) return false;
  const obs=r.abilitiesObserved||{};
  if(entry.ability1&&!obs.ability1) return false;
  if(entry.ability2&&!obs.ability2) return false;
  if(entry.hiddenAbility&&!obs.hiddenAbility) return false;
  return true;
}
function recordNewSpecies(dexId,name){
  const r=getResearch(dexId);
  if(!r.firstSeen){ r.firstSeen=true; addFinding('species',name); }
}
function addFinding(type,...args){ state.pendingFindings.push({type,args,time:Date.now()}); }
function isSpeciesKnown(dexId){ return !!state.researchLog[dexId]; }

// Shared evolution apply-logic: species/dexId swap, maxHP recalc (preserving missing HP),
// SPECIES registration, and research bookkeeping (recordNewSpecies, recordAbilityObserved,
// dexHistory increment). Used by checkEvolution()'s three paths, applyItemEvolution(), and
// professorAutoTestEvolutions()'s auto-apply (v0.21) — do not duplicate this block elsewhere.
function applySpeciesSwap(p,newEntry){
  const om=p.maxHP;
  p.species=newEntry.name; p.pokedexId=newEntry.dexId;
  p.maxHP=calcMaxHP(p.species,p.level,p.pokedexId);
  p.currentHP=Math.min(p.maxHP,p.currentHP+(p.maxHP-om));
  if(!SPECIES[p.species]) SPECIES[p.species]=newEntry;
  recordNewSpecies(newEntry.dexId,p.species);
  recordAbilityObserved(newEntry.dexId,p.ability);
  state.dexHistory[newEntry.dexId]=(state.dexHistory[newEntry.dexId]||0)+1;
}

// ── PROFESSOR EVOLUTION RESEARCH ──
// Auto-tests every owned evolution item against every known species.
// Fires on stone acquisition (buyItem) and on new species catch.
// Failed tests cost nothing — only successes consume an item.
// v0.20: also tests EVO_TREE `use-item` branches (branching species like Eevee),
// matched by itemId (a string slug, e.g. "water-stone") — distinct from the single-target
// pokedex.js evolveItem field, which stays matched by item NAME ("Water Stone").
// v0.21: a successful test also immediately evolves a matching owned individual (see below).
function professorAutoTestEvolutions(){
  if(!state.professorBag) return;
  const knownDexIds=Object.keys(state.dexHistory).map(Number).filter(id=>id>0);
  if(!knownDexIds.length) return;
  let anyChange=false;

  const evoItemIds=Object.keys(state.professorBag).filter(itemId=>{
    if((state.professorBag[itemId]||0)<=0) return false;
    const item=getItem(itemId);
    return item&&(item.effect==='evolve-stone'||item.effect==='evolve-trade');
  });

  for(const itemId of evoItemIds){
    const item=getItem(itemId);
    if(!item) continue;
    const itemName=item.name;

    for(const dexId of knownDexIds){
      if((state.professorBag[itemId]||0)<=0) break; // out of stock

      const r=getResearch(dexId);
      if(r.testedMethods.includes(itemName)) continue; // already tested this item against this species

      const entry=getPokemonEntry(dexId);
      let matched=false;
      let targetId=null;

      // Path 1: single-target SPECIES evolution (pokedex.js) — matched by item NAME
      if(entry){
        const evolvesByStone=item.effect==='evolve-stone'&&entry.evolveMethod==='use-item'&&entry.evolveItem===itemName;
        const evolvesByTrade=item.effect==='evolve-trade'&&entry.evolveMethod==='trade';
        if(evolvesByStone||evolvesByTrade){ matched=true; targetId=entry.evolvesIntoId; }
      }

      // Path 2 (v0.20): EVO_TREE branching evolutions — matched by itemId
      if(!matched){
        const branch=getEvolutions(dexId).find(b=>b.evolveMethod==='use-item'&&b.evolveItem===itemId);
        if(branch&&branch.toDexId){ matched=true; targetId=branch.toDexId; }
      }

      if(!matched){
        r.testedMethods.push(itemName); // ruled out — costs nothing, mark tested
        continue;
      }

      // v0.21: matched — find an eligible individual to auto-evolve.
      // Eligible = owned, in the Professor's possession (!p.holder — not with an aide), not evolveBlocked.
      // Highest level wins; ties broken by array order.
      const candidates=state.dex.filter(p=>p.pokedexId===dexId&&!p.holder&&!p.evolveBlocked);
      if(!candidates.length){
        // No eligible individual right now — defer entirely. Not marked tested, item not consumed.
        // Retried automatically the next time this function runs (next purchase or new-species catch).
        continue;
      }
      candidates.sort((a,b)=>b.level-a.level);
      const chosen=candidates[0];

      r.testedMethods.push(itemName);
      state.professorBag[itemId]--;
      if(state.professorBag[itemId]<=0) delete state.professorBag[itemId];
      const toEntry=getPokemonEntry(targetId);
      recordEvolution(dexId,targetId,itemName,chosen.level);
      const oldName=getDisplayName(chosen);
      if(toEntry) applySpeciesSwap(chosen,toEntry);
      addLog('🔬 Research: '+(entry?entry.name:'#'+dexId)+' confirmed to evolve with '+itemName+' → '+(toEntry?toEntry.name:'#'+targetId)+'! '+oldName+' #'+chosen.id+' evolved into '+getDisplayName(chosen)+'!','evolve');
      anyChange=true;
    }
  }
  if(anyChange){ renderDex(); renderBagDisplay(); }
}

// Apply a confirmed item-based evolution to a specific Pokémon and target species.
// intoId identifies which confirmed branch to apply — required since a branching species
// (e.g. Eevee) can have multiple simultaneously-confirmed item evolutions.
// Level-up and friendship evolutions remain automatic via checkEvolution() — this is for item/trade methods only.
function applyItemEvolution(catchId,intoId){
  const p=state.dex.find(x=>x.id===catchId); if(!p) return;
  if(p.evolveBlocked){ addLog('Evolution is blocked for this Pokémon.','fail'); return; }
  const r=state.researchLog[p.pokedexId];
  if(!r||!r.confirmedBranches||!r.confirmedBranches.length) return;
  const nonManual=['level','friendship','friendship-day','friendship-night','use-move'];
  const branch=r.confirmedBranches.find(b=>b.intoId===intoId&&!nonManual.includes(b.method));
  if(!branch){ addLog('That evolution is not available.','fail'); return; }
  const methodName=branch.method;
  const itemEntry=typeof ITEMS_DATA!=='undefined'?ITEMS_DATA.find(i=>i.name===methodName):null;
  if(!itemEntry){ addLog('Item not found in database: '+methodName,'fail'); return; }
  const itemId=itemEntry.itemId;
  if(!(state.professorBag[itemId]>0)){ addLog('No '+methodName+' in Professor\'s bag!','fail'); return; }
  const newEntry=getPokemonEntry(intoId);
  if(!newEntry){ addLog('Evolution target not found in database.','fail'); return; }
  // Consume item
  state.professorBag[itemId]--;
  if(state.professorBag[itemId]<=0) delete state.professorBag[itemId];
  // Apply evolution
  const old=getDisplayName(p);
  applySpeciesSwap(p,newEntry);
  addLog(old+' #'+p.id+' evolved into '+getDisplayName(p)+' using '+methodName+'!','evolve');
  document.getElementById('enc-body').textContent=old+' evolved into '+getDisplayName(p)+'!';
  saveGame(); render();
  const m=document.getElementById('poke-modal'); if(m) m.remove();
}

// Family/Species card display: lists every confirmed evolution target for a species.
// Shows ??? until at least one branch is confirmed. No per-branch ??? granularity (v0.20 scope).
function getEvolutionDisplayText(dexId){
  const r=state.researchLog[dexId];
  if(!r) return 'Evolves into: ???';
  if(r.nonEvolutionConfirmed) return 'Does not evolve';
  if(r.evolutionConfirmed&&r.confirmedBranches&&r.confirmedBranches.length){
    const fromEntry=getPokemonEntry(dexId);
    const names=r.confirmedBranches.map(b=>{
      const toEntry=getPokemonEntry(b.intoId);
      const toName=toEntry?toEntry.name:'#'+b.intoId;
      if(b.method==='level'){
        const dbLevel=fromEntry&&fromEntry.evolveLevel!=null?fromEntry.evolveLevel:r.highestLevelObserved;
        return toName+' (level Lv'+dbLevel+')';
      }
      return toName+' ('+b.method+')';
    });
    return 'Evolves into: '+names.join(', ');
  }
  return 'Evolves into: ??? (unconfirmed)';
}

// ── EVOLUTION ──
function checkEvolution(p){
  if(p.evolveBlocked) return; // v0.20 — per-individual block, skip entirely regardless of path
  // Path 1: dexId-based lookup — simple linear (single-target) evolutions from pokedex.js.
  // Must resolve by p.pokedexId, never by p.species name — some names (Nidoran M/F) map to
  // multiple distinct database rows with different evolution targets.
  const s=getPokemonEntry(p.pokedexId);
  if(s&&s.evolveMethod==='level'&&s.evolvesIntoId&&p.level>=s.evolveLevel){
    const newEntry=getPokemonEntry(s.evolvesIntoId);
    if(newEntry){
      const old=getDisplayName(p); const prevDexId=p.pokedexId;
      applySpeciesSwap(p,newEntry);
      recordEvolution(prevDexId,newEntry.dexId,'level',p.level);
      addLog(old+' #'+p.id+' evolved into '+getDisplayName(p)+'!','evolve');
      document.getElementById('enc-body').textContent=old+' evolved into '+getDisplayName(p)+'!';
      return;
    }
  }
  // v0.20 — friendship evolution (single-target): was tracked but never checked before this fix
  if(s&&s.evolveMethod==='friendship'&&s.evolvesIntoId&&p.friendship>=FRIENDSHIP_THRESHOLD){
    const newEntry=getPokemonEntry(s.evolvesIntoId);
    if(newEntry){
      const old=getDisplayName(p); const prevDexId=p.pokedexId;
      applySpeciesSwap(p,newEntry);
      recordEvolution(prevDexId,newEntry.dexId,'friendship',p.level);
      addLog(old+' #'+p.id+' evolved into '+getDisplayName(p)+'!','evolve');
      document.getElementById('enc-body').textContent=old+' evolved into '+getDisplayName(p)+'!';
      return;
    }
  }
  // Path 2 (v0.20): EVO_TREE lookup — branching evolutions (e.g. Eevee).
  // Handles level, friendship-day, and friendship-night branches automatically.
  // use-item branches are NOT auto-applied here — see professorAutoTestEvolutions()/applyItemEvolution().
  if(typeof EVO_TREE!=='undefined'){
    const hour=new Date().getHours();
    const isDay=hour>=6&&hour<18;
    const branches=getEvolutions(p.pokedexId).filter(b=>{
      if(!b.toDexId) return false;
      if(b.evolveMethod==='level') return p.level>=b.evolveLevel;
      if(b.evolveMethod==='friendship-day') return isDay&&p.friendship>=FRIENDSHIP_THRESHOLD;
      if(b.evolveMethod==='friendship-night') return !isDay&&p.friendship>=FRIENDSHIP_THRESHOLD;
      return false;
    });
    if(branches.length>0){
      const branch=branches[Math.floor(Math.random()*branches.length)];
      const newEntry=getPokemonEntry(branch.toDexId);
      if(newEntry){
        const old=getDisplayName(p); const prevDexId=p.pokedexId;
        applySpeciesSwap(p,newEntry);
        recordEvolution(prevDexId,newEntry.dexId,branch.evolveMethod,p.level);
        addLog(old+' #'+p.id+' evolved into '+getDisplayName(p)+'!','evolve');
        document.getElementById('enc-body').textContent=old+' evolved into '+getDisplayName(p)+'!';
      }
    }
  }
}

// Returns all EVO_TREE branch rows for a given fromDexId.
// v0.20 fix: this previously indexed EVO_TREE (an array) directly by dexId — e.g. EVO_TREE[133] —
// which is not the same as filtering for fromDexId===133, and silently returned wrong/empty
// results for every species. Branching evolutions never worked correctly until this fix.
function getEvolutions(dexId){
  if(typeof EVO_TREE==='undefined') return [];
  return EVO_TREE.filter(e=>e.fromDexId===dexId&&e.toDexId);
}

function giveExp(pokemon,amount){
  pokemon.exp+=amount;
  addLog(getDisplayName(pokemon)+' #'+pokemon.id+' +'+amount+' EXP','exp');
  let levelled=false;
  while(true){
    const s=getPokemonEntry(pokemon.pokedexId)||SPECIES[pokemon.species];
    const gr=pokemon.growthRate||(s?s.growthRate:null)||'mediumFast';
    const need=expToLevel(pokemon.level+1,gr);
    if(pokemon.exp>=need&&pokemon.level<100){
      pokemon.level++; levelled=true;
      const om=pokemon.maxHP; pokemon.maxHP=calcMaxHP(pokemon.species,pokemon.level,pokemon.pokedexId);
      pokemon.currentHP=Math.min(pokemon.maxHP,pokemon.currentHP+(pokemon.maxHP-om));
      addLog(getDisplayName(pokemon)+' #'+pokemon.id+' -> Lv'+pokemon.level+'!','evolve');
      checkEvolution(pokemon); saveGame();
      checkMethodRuleOut(pokemon.pokedexId,pokemon.level,pokemon.friendship);
    } else break;
  }
  if(levelled) renderDex();
}

function giveExpSilent(p,amount){
  p.exp+=amount;
  while(true){
    const s=getPokemonEntry(p.pokedexId)||SPECIES[p.species];
    const gr=p.growthRate||(s?s.growthRate:null)||'mediumFast';
    if(p.exp>=expToLevel(p.level+1,gr)&&p.level<100){
      p.level++;
      const om=p.maxHP; p.maxHP=calcMaxHP(p.species,p.level,p.pokedexId);
      p.currentHP=Math.min(p.maxHP,p.currentHP+(p.maxHP-om));
      applyEvolutionSilent(p);
      checkMethodRuleOut(p.pokedexId,p.level,p.friendship);
    } else break;
  }
}

// Same evolution conditions as checkEvolution(), without log/DOM side effects — used during
// offline batch simulation to avoid log spam over long away periods.
function applyEvolutionSilent(p){
  if(p.evolveBlocked) return;
  const s=getPokemonEntry(p.pokedexId);
  const tryApply=(toDexId,method)=>{
    const ne=getPokemonEntry(toDexId);
    if(!ne) return false;
    const prevDexId=p.pokedexId;
    applySpeciesSwap(p,ne);
    recordEvolution(prevDexId,ne.dexId,method,p.level);
    return true;
  };
  if(s&&s.evolveMethod==='level'&&s.evolvesIntoId&&p.level>=s.evolveLevel){
    if(tryApply(s.evolvesIntoId,'level')) return;
  }
  if(s&&s.evolveMethod==='friendship'&&s.evolvesIntoId&&p.friendship>=FRIENDSHIP_THRESHOLD){
    if(tryApply(s.evolvesIntoId,'friendship')) return;
  }
  if(typeof EVO_TREE!=='undefined'){
    const hour=new Date().getHours();
    const isDay=hour>=6&&hour<18;
    const branches=getEvolutions(p.pokedexId).filter(b=>{
      if(!b.toDexId) return false;
      if(b.evolveMethod==='level') return p.level>=b.evolveLevel;
      if(b.evolveMethod==='friendship-day') return isDay&&p.friendship>=FRIENDSHIP_THRESHOLD;
      if(b.evolveMethod==='friendship-night') return !isDay&&p.friendship>=FRIENDSHIP_THRESHOLD;
      return false;
    });
    if(branches.length>0){
      const branch=branches[Math.floor(Math.random()*branches.length)];
      tryApply(branch.toDexId,branch.evolveMethod);
    }
  }
}

// ── OFFLINE PROCESSING ──
function processOfflineTime(secsAway){
  if(secsAway<10||!state.missionActive) return null;
  const summary={encounters:0,catches:0,wins:0,income:0,evolutions:[],heals:0,shinies:0};
  const perMin=1.00+Math.floor(state.totalCatches/100)*0.01;
  const income=Math.round((perMin/60)*secsAway*100)/100;
  state.funds=Math.round((state.funds+income)*100)/100;
  summary.income=income;

  // Apply offline friendship ticks
  const friendshipTicks=Math.floor(secsAway/180);
  if(friendshipTicks>0){
    state.party.forEach(p=>{ if(p.currentHP>0){ p.friendship=(p.friendship||0)+friendshipTicks; checkMethodRuleOut(p.pokedexId,p.level,p.friendship); } });
  }

  let remaining=secsAway, nextIn=state.nextEncounterIn;
  while(remaining>=nextIn){
    remaining-=nextIn; nextIn=ENC_INTERVAL; summary.encounters++;
    // v0.22 fix: checkLocationHeal() previously only ran in live gameTick(), never offline —
    // missions dwelling in/passing through a heals:true location took real damage offline
    // that they wouldn't take live. Mirrors live order: heal-check fires before the encounter.
    // Silent (no per-encounter log, consistent with offline's batched-summary design) — tallied.
    {
      const locData=typeof LOCATIONS!=='undefined'?getLocation(state.currentLocation):null;
      if(state.missionActive&&locData&&(locData.heals==='TRUE'||locData.heals===true||locData.heals==='true')){
        const needsHeal=state.party.some(p=>p.currentHP<p.maxHP||p.currentHP<=0);
        if(needsHeal){ state.party.forEach(p=>{ p.currentHP=p.maxHP; }); summary.heals++; }
      }
    }
    const enc=rollEncounter(); const lead=getLeadPokemon();
    if(!lead){
      // v0.20 fix: previously broke the whole catch-up loop unconditionally on a wipe,
      // abandoning the rest of the away period even with autoRepeat on. Now mirrors
      // endMission()'s auto-repeat path: heal at lastHealLocation, rebuild the travel path
      // to missionDestination, and keep simulating instead of stopping.
      if(state.autoRepeat){
        const returnLocId=state.lastHealLocation||state.missionOrigin||'palletTown';
        state.party.forEach(p=>{ p.currentHP=p.maxHP; });
        state.currentLocation=returnLocId;
        state.travelPath=buildTravelPath(returnLocId,state.missionDestination);
        state.travelPathIndex=0;
        if(state.travelPath.length>0){ arriveAtLocation(state.travelPath[0]); }
        else { state.currentLocation=state.missionDestination; }
        continue;
      }
      break;
    }
    if(enc){
      // Write seen to encounter log
      const encLocKey=state.currentLocation;
      if(!state.locationEncounterLog[encLocKey]) state.locationEncounterLog[encLocKey]={};
      const encDexKey=parseInt(enc.pokedexId)||0;
      if(encDexKey){
        if(!state.locationEncounterLog[encLocKey][encDexKey]) state.locationEncounterLog[encLocKey][encDexKey]={seen:0,caught:0};
        state.locationEncounterLog[encLocKey][encDexKey].seen++;
      }

      const ballId=selectBallId();
      // v0.22 fix: shiny roll never existed offline — catchPokemon(lead,enc,false) was
      // hardcoded false, making offline shinies impossible regardless of away-time length.
      // Mirrors live resolveEncounterStep() Step 1: fires before ball logic, no ball consumed.
      if(Math.random()<(1/4096)){
        const caught=makePokemon(enc.species,enc.level,enc.gender,null,enc.pokedexId);
        caught.isShiny=true;
        state.dex.push(caught); state.totalCatches++; state.totalSightings++;
        summary.catches++; summary.shinies=(summary.shinies||0)+1;
        state.dexHistory[caught.pokedexId]=(state.dexHistory[caught.pokedexId]||0)+1;
        recordAbilityObserved(caught.pokedexId,caught.ability);
        const s_=getPokemonEntry(enc.pokedexId);
        const exp=Math.floor(((s_?s_.baseExpYield:51)||51)*enc.level/7);
        giveExpSilent(lead,exp);
        recordSighting(enc.pokedexId||caught.pokedexId,enc.level);
        if(!isSpeciesKnown(caught.pokedexId)||!state.researchLog[caught.pokedexId].firstSeen)
          recordNewSpecies(caught.pokedexId,enc.species);
        if(encDexKey) state.locationEncounterLog[encLocKey][encDexKey].caught++;
        checkSpeciesCap(caught);
      } else if(ballId){
        const s_=getPokemonEntry(enc.pokedexId);
        const exp=Math.floor(((s_?s_.baseExpYield:51)||51)*enc.level/7);
        giveExpSilent(lead,exp);
        useItemFromBag(ballId,null);
        const ball=getItem(ballId);
        const modifier=ball&&ball.catchRateModifier?parseFloat(ball.catchRateModifier):1;
        const catchRate=modifier>=255?1:Math.min(0.99,0.75*modifier);
        if(Math.random()<catchRate){
          const caught=makePokemon(enc.species,enc.level,enc.gender,null,enc.pokedexId);
          state.dex.push(caught); state.totalCatches++; state.totalSightings++;
          summary.catches++;
          state.dexHistory[caught.pokedexId]=(state.dexHistory[caught.pokedexId]||0)+1;
          recordAbilityObserved(caught.pokedexId,caught.ability);
          if(!isSpeciesKnown(caught.pokedexId)||!state.researchLog[caught.pokedexId].firstSeen)
            recordNewSpecies(caught.pokedexId,enc.species);
          recordSighting(enc.pokedexId||caught.pokedexId,enc.level);
          // Write caught to encounter log
          if(encDexKey) state.locationEncounterLog[encLocKey][encDexKey].caught++;
          // Per-species cap check
          checkSpeciesCap(caught);
        } else {
          const dmg=Math.max(1,Math.floor((enc.level/lead.level)*0.5*0.25*lead.maxHP));
          lead.currentHP=Math.max(0,lead.currentHP-dmg);
        }
      } else {
        const dmg=Math.max(1,Math.floor((enc.level/lead.level)*0.5*lead.maxHP));
        lead.currentHP=Math.max(0,lead.currentHP-dmg);
        if(lead.currentHP>0){
          const s_=getPokemonEntry(enc.pokedexId);
          const exp=Math.floor(((s_?s_.baseExpYield:51)||51)*enc.level/7);
          giveExpSilent(lead,exp); summary.wins++;
        }
      }
    }
    advanceTravelPath();
  }
  state.nextEncounterIn=Math.max(1,nextIn-remaining);
  return summary;
}

function showOfflineBanner(secsAway,summary){
  const mins=Math.floor(secsAway/60), secs=secsAway%60;
  let extra='';
  if(summary.heals>0) extra+=' · '+summary.heals+' free heals';
  if(summary.shinies>0) extra+=' · ✨'+summary.shinies+' shiny!';
  document.getElementById('offline-summary').innerHTML=
    'Away for '+mins+'m '+secs+'s · '+summary.encounters+' encounters · '+
    summary.catches+' catches · +$'+summary.income.toFixed(2)+extra;
  document.getElementById('offline-banner').style.display='block';
}

// ── ENCOUNTER ──
// ── ENCOUNTER ROLL ──
// Two-stage: pick method (by location role), then pick species within that method's table.
// Passthrough waypoints use defaultEncounterMethod from locations data.
// Destination uses state.locationMethodPrefs[locId] (or defaultEncounterMethod if no pref set).
function rollEncounter(){
  const locId=state.currentLocation;
  const table=buildRouteTable(locId);
  if(!table.length) return null;

  const atDest=locId===state.missionDestination;
  let method;
  if(atDest){
    method=pickMethodForLocation(locId,table);
  } else {
    const locData=typeof LOCATIONS!=='undefined'?getLocation(locId):null;
    method=(locData&&locData.defaultEncounterMethod)||'grass';
  }

  const methodTable=table.filter(e=>e.method===method);
  const rollTable=methodTable.length?methodTable:table; // fallback to all if method has no rows
  return rollFromTable(rollTable);
}

function pickMethodForLocation(locId,table){
  const availableMethods=[...new Set(table.map(e=>e.method))];
  const prefs=state.locationMethodPrefs[locId];
  if(!prefs||!prefs.methods||!prefs.methods.length){
    // Default: even split — pick randomly from available
    return availableMethods[Math.floor(Math.random()*availableMethods.length)];
  }
  // Filter to only checked methods that actually have rows
  const active=prefs.methods.filter(m=>availableMethods.includes(m));
  if(!active.length) return availableMethods[Math.floor(Math.random()*availableMethods.length)];
  // Weighted roll
  const weights=prefs.weights||{};
  const total=active.reduce((s,m)=>s+(weights[m]||1),0);
  let r=Math.random()*total;
  for(const m of active){ r-=(weights[m]||1); if(r<=0) return m; }
  return active[active.length-1];
}

function rollFromTable(table){
  const totalW=table.reduce((s,e)=>s+(e.weight||10),0);
  let r=Math.random()*totalW;
  for(const e of table){
    r-=(e.weight||10);
    if(r<=0){
      const lv=Math.floor(Math.random()*(e.maxLv-e.minLv+1))+e.minLv;
      const entry=getPokemonEntry(e.dexId);
      const name=entry?entry.name:'#'+e.dexId;
      const genderMalePct=entry?entry.genderMalePct:50;
      let gender='M';
      if(genderMalePct===null||genderMalePct===undefined) gender='—';
      else if(genderMalePct===0) gender='F';
      else if(genderMalePct===100) gender='M';
      else gender=Math.random()*100<genderMalePct?'M':'F';
      // Always use parseInt to ensure numeric pokedexId for encounter log key integrity
      return {species:name,level:lv,gender,pokedexId:parseInt(e.dexId),baseSpd:entry?entry.baseSpd||50:50};
    }
  }
  return null;
}

// Per-species cap: flat max 6 non-shiny individuals, regardless of aide count. Shiny exempt.
// Catch-then-release: stats (totalCatches, dexHistory) already counted before this is called.
function checkSpeciesCap(caught){
  if(caught.isShiny) return; // shinies never released
  const liveNonShiny=state.dex.filter(p=>p.pokedexId===caught.pokedexId&&!p.isShiny);
  if(liveNonShiny.length>6){
    state.dex=state.dex.filter(p=>p.id!==caught.id);
    addLog('Released '+getDisplayName(caught)+' #'+caught.id+' — species cap reached (6 max).','info');
  }
}

function getLeadPokemon(){
  sortParty();
  return state.party.find(p=>p.currentHP>0)||null;
}

function checkLocationHeal(){
  if(!state.missionActive) return;
  const locData=typeof LOCATIONS!=='undefined'?getLocation(state.currentLocation):null;
  if(locData&&(locData.heals==='TRUE'||locData.heals===true||locData.heals==='true')){
    const needsHeal=state.party.some(p=>p.currentHP<p.maxHP||p.currentHP<=0);
    if(needsHeal){
      state.party.forEach(p=>{ p.currentHP=p.maxHP; });
      addLog('🏥 Party fully healed at '+locData.name+'!','info');
    }
  }
}

// ── COMBAT ──
function resolveEncounterStep(){
  const enc=state.currentEncounter; if(!enc) return;

  // Step 1: Shiny check — fires before anything else. Auto-catch, no ball needed.
  if(Math.random()<(1/4096)){
    const lead=getLeadPokemon(); if(!lead){ endMission(); return; }
    const caught=makePokemon(enc.species,enc.level,enc.gender,null,enc.pokedexId);
    caught.isShiny=true;
    state.dex.push(caught); state.totalCatches++; state.totalSightings++;
    state.dexHistory[caught.pokedexId]=(state.dexHistory[caught.pokedexId]||0)+1;
    recordAbilityObserved(caught.pokedexId,caught.ability);
    const s_=SPECIES[enc.species];
    const exp=Math.floor(((s_?s_.baseExpYield||s_.baseExp:51)*enc.level)/7);
    giveExp(lead,exp);
    recordSighting(enc.pokedexId||caught.pokedexId,enc.level);
    if(!isSpeciesKnown(caught.pokedexId)||!state.researchLog[caught.pokedexId].firstSeen)
      recordNewSpecies(caught.pokedexId,enc.species);
    addLog('✨ SHINY '+getDisplayName(caught)+' caught automatically! ✨','evolve');
    document.getElementById('total-catches').textContent=state.totalCatches;
    document.getElementById('total-sightings').textContent=state.totalSightings;
    document.getElementById('enc-body').textContent='✨ SHINY '+enc.species+' caught!';
    state.currentEncounter=null; advanceTravelPath(); saveGame(); return;
  }

  const lead=getLeadPokemon(); if(!lead){ endMission(); return; }

  // Step 2: Opportunistic revive — any fainted party member, any time a Revive is available
  // (v0.22 fix: previously gated on lead.currentHP<=0, which getLeadPokemon() already guarantees
  // is never true — that gate made this block permanently dead code. Now fires independent of lead.)
  {
    const fainted=state.party.filter(p=>p.currentHP<=0).sort((a,b)=>a.level-b.level);
    for(const fp of fainted){
      if((state.professorBag['revive']||0)>0){ useItemFromBag('revive',fp); break; }
      if((state.professorBag['max-revive']||0)>0){ useItemFromBag('max-revive',fp); break; }
    }
  }

  // Step 3: Try potion on lead (no waste rule, no threshold)
  const potionId=getWeakestEffectivePotion(lead);
  if(potionId) useItemFromBag(potionId,lead);

  // Step 4: Speed check
  const leadEntry=getPokemonEntry(lead.pokedexId);
  const leadSpd=leadEntry?Math.floor(((leadEntry.baseSpd||50)*2*lead.level)/100)+5:lead.level;
  const encSpd=enc.baseSpd?Math.floor((enc.baseSpd*2*enc.level)/100)+5:enc.level;
  const leadFaster=leadSpd>=encSpd;

  const hasBalls=getBallCount()>0;

  // Step 5: Act
  if(hasBalls){
    if(leadFaster){
      throwBall(lead,enc);
    } else {
      // Enemy acts first at 25% of normal damage (level ratio × 0.5 × 0.25 × maxHP)
      const dmg=Math.max(1,Math.floor((enc.level/lead.level)*0.5*0.25*lead.maxHP));
      lead.currentHP=Math.max(0,lead.currentHP-dmg);
      addLog(enc.species+' Lv'+enc.level+' strikes first! '+getDisplayName(lead)+' takes '+dmg+' dmg. ('+lead.currentHP+'/'+lead.maxHP+' HP)','damage');
      document.getElementById('enc-body').textContent=enc.species+' moves first! '+getDisplayName(lead)+' at '+lead.currentHP+'/'+lead.maxHP+' HP';
      if(lead.currentHP<=0){
        addLog(getDisplayName(lead)+' #'+lead.id+' fainted!','faint');
        const next=getLeadPokemon(); if(!next){ endMission(); return; }
        addLog(enc.species+' fled.','info'); state.currentEncounter=null;
        advanceTravelPath(); return;
      }
      throwBall(lead,enc);
    }
  } else {
    fight(lead,enc);
  }
}

// Selects the highest-priority ball available in professorBag, falling back to any ball.
// Shared by throwBall() (online) and processOfflineTime() (offline) so catch behavior matches.
function selectBallId(){
  const ballPriority=['master-ball','ultra-ball','great-ball','poke-ball'];
  for(const b of ballPriority){ if((state.professorBag[b]||0)>0) return b; }
  const found=Object.entries(state.professorBag||{}).find(([id,qty])=>{ const item=getItem(id); return item&&item.itemCategory==='ball'&&qty>0; });
  return found?found[0]:null;
}

function throwBall(lead,enc){
  const ballId=selectBallId();
  if(!ballId){ fight(lead,enc); return; }
  useItemFromBag(ballId,null);
  const ball=getItem(ballId);
  const modifier=ball&&ball.catchRateModifier?parseFloat(ball.catchRateModifier):1;
  const catchRate=modifier>=255?1:Math.min(0.99,0.75*modifier);
  if(Math.random()<catchRate){
    catchPokemon(lead,enc,false);
  } else {
    // Missed throw: enemy counter-attacks at 25% of normal damage (level ratio × 0.5 × 0.25 × maxHP)
    const dmg=Math.max(1,Math.floor((enc.level/lead.level)*0.5*0.25*lead.maxHP));
    lead.currentHP=Math.max(0,lead.currentHP-dmg);
    addLog('Ball missed! '+enc.species+' Lv'+enc.level+' deals '+dmg+' HP. ('+getDisplayName(lead)+': '+lead.currentHP+'/'+lead.maxHP+' HP)','fail');
    document.getElementById('enc-body').textContent='Ball missed! '+getDisplayName(lead)+' at '+lead.currentHP+'/'+lead.maxHP+' HP';
    if(lead.currentHP<=0){ addLog(getDisplayName(lead)+' #'+lead.id+' fainted!','faint'); const next=getLeadPokemon(); if(!next) endMission(); }
  }
}

function catchPokemon(lead,enc,isShiny){
  const caught=makePokemon(enc.species,enc.level,enc.gender,null,enc.pokedexId);
  caught.isShiny=isShiny;
  state.dex.push(caught); state.totalCatches++; state.totalSightings++;
  state.dexHistory[caught.pokedexId]=(state.dexHistory[caught.pokedexId]||0)+1;
  recordAbilityObserved(caught.pokedexId,caught.ability);
  if(isShiny) addLog('✨ SHINY '+getDisplayName(caught)+' caught automatically! ✨','evolve');
  const s_=SPECIES[enc.species];
  const exp=Math.floor(((s_?s_.baseExpYield||s_.baseExp:51)*enc.level)/7);
  giveExp(lead,exp);
  recordSighting(enc.pokedexId||caught.pokedexId,enc.level);
  const isNew=!isSpeciesKnown(caught.pokedexId)||!state.researchLog[caught.pokedexId].firstSeen;
  if(isNew) recordNewSpecies(caught.pokedexId,enc.species);
  addLog('Caught '+getDisplayName(caught)+' #'+caught.id+' (Lv'+enc.level+' '+enc.gender+(isShiny?' ✨':'')+')! +'+exp+' EXP','catch');
  document.getElementById('total-catches').textContent=state.totalCatches;
  document.getElementById('total-sightings').textContent=state.totalSightings;
  // Write caught to encounter log — {seen, caught} schema
  if(!state.locationEncounterLog[state.currentLocation]) state.locationEncounterLog[state.currentLocation]={};
  const lid=parseInt(caught.pokedexId);
  if(lid){
    if(!state.locationEncounterLog[state.currentLocation][lid]) state.locationEncounterLog[state.currentLocation][lid]={seen:0,caught:0};
    state.locationEncounterLog[state.currentLocation][lid].caught++;
  }
  // Per-species cap: catch-then-release overflow non-shinies
  checkSpeciesCap(caught);
  // Professor auto-tests evolution items against new species
  if(isNew) professorAutoTestEvolutions();
  state.currentEncounter=null;
  advanceTravelPath();
  document.getElementById('enc-body').textContent='Caught '+enc.species+' Lv'+enc.level+(isShiny?' ✨ SHINY!':'!');
  saveGame();
}

// Fight: one-tick resolution. Formula simulates the entire battle.
// lead takes (enc.level/lead.level) × 0.5 × maxHP damage.
// If lead survives, gains EXP and encounter ends.
function fight(lead,enc){
  const dmg=Math.max(1,Math.floor((enc.level/lead.level)*0.5*lead.maxHP));
  lead.currentHP=Math.max(0,lead.currentHP-dmg);
  addLog(getDisplayName(lead)+' vs '+enc.species+' Lv'+enc.level+': took '+dmg+' dmg. ('+lead.currentHP+'/'+lead.maxHP+' HP)','damage');
  if(lead.currentHP<=0){
    addLog(getDisplayName(lead)+' #'+lead.id+' fainted!','faint');
    const next=getLeadPokemon(); if(!next){ endMission(); return; }
    addLog(enc.species+' fled.','info'); state.currentEncounter=null;
    advanceTravelPath();
    document.getElementById('enc-body').textContent=getDisplayName(lead)+' fainted. '+enc.species+' fled.';
  } else {
    const s_=SPECIES[enc.species];
    const exp=Math.floor(((s_?s_.baseExpYield||s_.baseExp:51)*enc.level)/7);
    giveExp(lead,exp);
    addLog('Won vs '+enc.species+' Lv'+enc.level+'! +'+exp+' EXP','win');
    state.currentEncounter=null;
    advanceTravelPath();
    document.getElementById('enc-body').textContent='Won vs '+enc.species+' Lv'+enc.level+'.';
  }
}

// ── INCOME ──
function incomeTick(){
  const perMin=1.00+Math.floor(state.totalCatches/100)*0.01;
  state.incomeAccumulator+=perMin/60;
  if(state.incomeAccumulator>=0.01){
    const c=Math.floor(state.incomeAccumulator*100);
    state.funds=Math.max(0,Math.round((state.funds+c/100)*100)/100);
    state.incomeAccumulator-=c/100;
  }
  if(state.funds<0||isNaN(state.funds)) state.funds=0;
  document.getElementById('funds-display').textContent=state.funds.toFixed(2);
  document.getElementById('income-display').textContent=perMin.toFixed(2);
}

// ── GAME TICK ──
function gameTick(){
  incomeTick();
  if(state.missionActive){
    state._friendshipTick=(state._friendshipTick||0)+1;
    if(state._friendshipTick>=180){
      state._friendshipTick=0;
      state.party.forEach(p=>{ if(p.currentHP>0){ p.friendship=(p.friendship||0)+1; checkMethodRuleOut(p.pokedexId,p.level,p.friendship); } });
    }
  }
  if(!state.missionActive){ renderParty(); return; }
  state.missionElapsed++; state.nextEncounterIn--;
  if(state.currentEncounter){ resolveEncounterStep(); render(); return; }
  if(state.nextEncounterIn<=0){
    checkLocationHeal();
    state.currentEncounter=rollEncounter(); state.nextEncounterIn=ENC_INTERVAL;
    if(!state.currentEncounter){
      advanceTravelPath();
      state.nextEncounterIn=ENC_INTERVAL; updateLocation(); return;
    }
    const enc=state.currentEncounter;
    // Write seen to encounter log — always use parseInt for numeric key
    if(!state.locationEncounterLog[state.currentLocation]) state.locationEncounterLog[state.currentLocation]={};
    const encDexKey=parseInt(enc.pokedexId)||0;
    if(encDexKey){
      if(!state.locationEncounterLog[state.currentLocation][encDexKey]) state.locationEncounterLog[state.currentLocation][encDexKey]={seen:0,caught:0};
      state.locationEncounterLog[state.currentLocation][encDexKey].seen++;
    }
    addLog('Wild '+enc.species+' appeared! Lv'+enc.level+' '+enc.gender,'info');
    document.getElementById('enc-body').textContent='Wild '+enc.species+' Lv'+enc.level+' ('+enc.gender+') appeared!';
    state.totalSightings++;
    document.getElementById('total-sightings').textContent=state.totalSightings;
    render();
  } else { updateLocation(); renderParty(); }
}

// ── MISSION ──
function startMission(){
  if(state.missionActive) return;
  if(!state.party.find(p=>p.currentHP>0)){ addLog('No conscious Pokémon!','fail'); return; }
  showMissionModal();
}

// ── MISSION MODAL — DESTINATION SORT (v0.21) ──
// Transient UI-only state — not persisted to `state`, resets every time the modal opens.
let missionSortField=null; // null|'distance'|'alpha'|'encounters'
let missionSortDir='asc';

// Distance = encounter-cycles to REACH a destination: sum of travelTime for every waypoint
// strictly before the destination itself (excludes the destination's own travelTime, per the
// settled travelTime rule — a destination never delays arrival at itself). One-hop = 0.
function computeMissionDistance(fromId,toId){
  const path=buildTravelPath(fromId,toId);
  if(!path.length) return Infinity;
  let total=0;
  for(let i=0;i<path.length-1;i++){
    const locData=typeof LOCATIONS!=='undefined'?getLocation(path[i]):null;
    total+=Math.max(1,locData&&locData.travelTime?parseInt(locData.travelTime):1);
  }
  return total;
}

// Encounters sort metric = sightings ('seen') summed across all species logged at a location.
function computeLocationSightings(locId){
  const log=state.locationEncounterLog[locId];
  if(!log) return 0;
  return Object.values(log).reduce((sum,v)=>sum+((v&&v.seen)||0),0);
}

// Re-renders only the destination list + sort buttons — leaves any in-progress
// destination selection / method prefs / shop panel untouched.
function renderDestList(){
  const currentLoc=state.currentLocation||'palletTown';
  let reachable=getReachableDiscoveredLocations(currentLoc);
  if(missionSortField){
    reachable=[...reachable].sort((a,b)=>{
      let av,bv;
      if(missionSortField==='distance'){
        av=computeMissionDistance(currentLoc,a); bv=computeMissionDistance(currentLoc,b);
      } else if(missionSortField==='alpha'){
        const aLoc=typeof LOCATIONS!=='undefined'?getLocation(a):null;
        const bLoc=typeof LOCATIONS!=='undefined'?getLocation(b):null;
        av=(aLoc?aLoc.name:a).toLowerCase(); bv=(bLoc?bLoc.name:b).toLowerCase();
      } else {
        av=computeLocationSightings(a); bv=computeLocationSightings(b);
      }
      if(av<bv) return missionSortDir==='asc'?-1:1;
      if(av>bv) return missionSortDir==='asc'?1:-1;
      return 0;
    });
  }
  const listEl=document.getElementById('dest-list-container');
  if(listEl){
    listEl.innerHTML=reachable.length
      ?reachable.map(loc=>{
          const locData=typeof LOCATIONS!=='undefined'?getLocation(loc):null;
          const name=locData?locData.name:loc;
          return '<button onclick="selectMissionDest(\''+loc+'\')" style="display:block;width:100%;margin-bottom:6px;padding:10px;text-align:left;border-color:#5dade2;color:#5dade2;">'+name+'</button>';
        }).join('')
      : '<div style="color:#e67e22;font-size:11px;padding:8px 0;">No destinations reachable from here.</div>';
  }
  const btnWrap=document.getElementById('dest-sort-buttons');
  if(btnWrap) btnWrap.innerHTML=destSortButtonHtml('distance','Distance')+destSortButtonHtml('alpha','Alphabetical')+destSortButtonHtml('encounters','Encounters');
}

// Build method checkboxes for the selected destination.
// Methods not present in encounter table = invisible.
// Methods present but requiresItem not owned by aide = disabled.
function renderMethodPrefs(locId){
  const el=document.getElementById('method-prefs'); if(!el) return;
  // All encounters at this location
  const allEncs=typeof ENCOUNTERS!=='undefined'?ENCOUNTERS.filter(e=>e.locationId===locId):[];
  if(!allEncs.length){ el.innerHTML=''; return; }

  // Methods present at this location (fishing split into per-rod-tier sub-methods — v0.21 scoped fix)
  const allMethods=[...new Set(allEncs.map(e=>getEncounterSubMethod(e.encounterMethod||'grass',e.requiresItem)))];
  // Which methods are locked (requiresItem not owned)
  const lockedMethods=new Set();
  allEncs.forEach(e=>{
    const m=getEncounterSubMethod(e.encounterMethod||'grass',e.requiresItem);
    if(e.requiresItem&&!(state.trainerBag[e.requiresItem]>0)) lockedMethods.add(m);
  });
  // Available (non-locked) methods
  const availMethods=allMethods.filter(m=>!lockedMethods.has(m));

  // Load or default prefs
  const prefs=state.locationMethodPrefs[locId];
  const defaultChecked=availMethods; // all available checked by default

  let html='<div style="margin-top:10px;border-top:1px solid #0f3460;padding-top:10px;">';
  html+='<div style="color:#a0a0c0;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">Encounter Methods</div>';

  allMethods.forEach(method=>{
    const locked=lockedMethods.has(method);
    const checked=locked?false:(prefs?prefs.methods.includes(method):defaultChecked.includes(method));
    const weight=prefs&&prefs.weights?(prefs.weights[method]||1):1;
    const label=FISH_ROD_LABELS[method]||method;
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;opacity:'+(locked?'0.4':'1')+'">';
    html+='<input type="checkbox" id="meth-'+method+'" '+(checked?'checked':'')+' '+(locked?'disabled':'')+' onchange="updateMethodPrefs(\''+locId+'\')" style="width:14px;height:14px;cursor:'+(locked?'not-allowed':'pointer')+'">';
    html+='<label for="meth-'+method+'" style="color:#e0e0e0;font-size:11px;flex:1;cursor:'+(locked?'not-allowed':'pointer')+'">'+label+(locked?' 🔒':'')+' </label>';
    html+='<input type="number" id="wt-'+method+'" value="'+weight+'" min="1" max="99" '+(locked?'disabled':'')+' oninput="updateMethodPrefs(\''+locId+'\')" style="width:38px;padding:2px 4px;background:#0a1a2a;border:1px solid #1a4a80;color:#e0e0e0;font-family:\'Courier New\',monospace;font-size:10px;border-radius:2px;">';
    html+='</div>';
  });
  html+='<div style="color:#555;font-size:10px;margin-top:4px;">Weights are relative (e.g. 70 / 30).</div>';
  html+='</div>';
  el.innerHTML=html;

  // Initialise prefs in state if not set
  if(!prefs) updateMethodPrefs(locId);
}

function updateMethodPrefs(locId){
  const allEncs=typeof ENCOUNTERS!=='undefined'?ENCOUNTERS.filter(e=>e.locationId===locId):[];
  const allMethods=[...new Set(allEncs.map(e=>getEncounterSubMethod(e.encounterMethod||'grass',e.requiresItem)))];
  const methods=[]; const weights={};
  allMethods.forEach(method=>{
    const cb=document.getElementById('meth-'+method);
    const wt=document.getElementById('wt-'+method);
    if(cb&&cb.checked&&!cb.disabled){
      methods.push(method);
      weights[method]=parseInt(wt?wt.value:1)||1;
    }
  });
  state.locationMethodPrefs[locId]={methods,weights};
}

function confirmMission(){
  if(!state._missionDest) return;
  const modal=document.getElementById('mission-modal');
  if(modal) modal.remove();
  state.missionActive=true;
  state.missionBehavior='research';
  state.missionDestination=state._missionDest||'route1';
  state.missionOrigin=state.currentLocation||'palletTown';
  state.travelPath=buildTravelPath(state.missionOrigin,state.missionDestination);
  if(state.travelPath.length===0){
    addLog('⚠ Cannot reach that destination — missing required item.','fail');
    state.missionActive=false;
    document.getElementById('btn-start').disabled=false;
    document.getElementById('btn-recall').disabled=true;
    return;
  }
  sortParty();
  state.travelPathIndex=0;
  arriveAtLocation(state.travelPath[0]);
  state.nextEncounterIn=ENC_INTERVAL;
  document.getElementById('btn-start').disabled=true;
  document.getElementById('btn-recall').disabled=false;
  const locData=typeof LOCATIONS!=='undefined'?getLocation(state.missionDestination):null;
  addLog('Carl Oak dispatched to '+(locData?locData.name:state.missionDestination)+' (research on arrival).','info');
  state.pendingFindings=[];
  render();
}

function recallMission(){
  if(!state.missionActive) return;
  endMission('recall');
}

// Unified mission end — handles both recall and faint.
// Always returns to lastHealLocation (last location with heals:true visited).
// Always calls showFindingsReport(), including in auto-repeat path.
function endMission(reason='faint'){
  state.missionActive=false;
  state.currentEncounter=null;
  document.getElementById('btn-start').disabled=false;
  document.getElementById('btn-recall').disabled=true;
  const returnLocId=state.lastHealLocation||state.missionOrigin||'palletTown';
  state.currentLocation=returnLocId;
  const originLoc=typeof LOCATIONS!=='undefined'?getLocation(returnLocId):null;
  const originName=originLoc?originLoc.name:returnLocId;
  const msg=reason==='recall'?'Carl Oak recalled to '+originName+'.':'All fainted — Carl Oak returned to '+originName+'.';
  document.getElementById('enc-body').textContent=msg;
  addLog(msg,reason==='recall'?'info':'faint');
  if(originLoc&&(originLoc.heals==='TRUE'||originLoc.heals===true||originLoc.heals==='true')){
    const needsHeal=state.party.some(p=>p.currentHP<p.maxHP||p.currentHP<=0);
    if(needsHeal){
      state.party.forEach(p=>{ p.currentHP=p.maxHP; });
      addLog('🏥 Party fully healed at '+originLoc.name+'!','info');
    }
  }
  showFindingsReport();
  updateLocation(); saveGame();
  if(reason==='faint'&&state.autoRepeat){
    setTimeout(()=>{
      if(!state.missionActive&&state.party.find(p=>p.currentHP>0)){
        addLog('🔄 Auto-repeating mission...','info');
        state.missionActive=true;
        sortParty();
        state.travelPath=buildTravelPath(state.currentLocation,state.missionDestination);
        state.travelPathIndex=0;
        if(state.travelPath.length>0){ arriveAtLocation(state.travelPath[0]); }
        else { state.currentLocation=state.missionDestination; }
        state.nextEncounterIn=ENC_INTERVAL;
        state.pendingFindings=[];
        document.getElementById('btn-start').disabled=true;
        document.getElementById('btn-recall').disabled=false;
        updateLocation(); render();
      }
    },2000);
  }
}

function updateLocation(){
  const el=document.getElementById('aide-location');
  if(state.missionActive){
    const m=Math.floor(state.nextEncounterIn/60), s=state.nextEncounterIn%60;
    const curLocData=typeof LOCATIONS!=='undefined'?getLocation(state.currentLocation):null;
    const curLocName=curLocData?curLocData.name:(state.currentLocation||'Route 1');
    const destLocData=typeof LOCATIONS!=='undefined'?getLocation(state.missionDestination):null;
    const destLocName=destLocData?destLocData.name:state.missionDestination;
    const atDest=state.currentLocation===state.missionDestination;
    if(atDest){
      el.textContent='📍 '+curLocName+' — Researching · Next: '+m+':'+s.toString().padStart(2,'0');
    } else {
      el.textContent='📍 '+curLocName+' (→ '+destLocName+', '+(state.travelCyclesRemaining||0)+' enc left) · Next: '+m+':'+s.toString().padStart(2,'0');
    }
  } else {
    const idleLoc=typeof LOCATIONS!=='undefined'?getLocation(state.currentLocation||'palletTown'):null;
    el.textContent='📍 '+(idleLoc?idleLoc.name:'Pallet Town')+' — Idle';
  }
}

// ── SHOP ──
// Routes purchase to professorBag or trainerBag based on item's bagType field.
function buyItem(itemId, qty){
  qty=parseInt(qty)||1;
  const item=getItem(itemId);
  if(!item||!item.shopPrice) return;
  const price=parseFloat(item.shopPrice);
  if(state.funds<price){ addLog('Not enough funds for '+item.name+'!','fail'); return; }
  const maxCanBuy=Math.floor(state.funds/price);
  if(maxCanBuy<=0){ addLog('Not enough funds for '+item.name+'!','fail'); return; }
  const actualQty=Math.min(qty,maxCanBuy);
  const totalCost=Math.round(price*actualQty*100)/100;
  state.funds=Math.round((state.funds-totalCost)*100)/100;

  // Route to correct inventory by bagType
  const isTrainerItem=item.bagType&&item.bagType.toLowerCase()==='trainer';
  const targetBag=isTrainerItem?state.trainerBag:state.professorBag;
  if(!targetBag) return;
  targetBag[itemId]=(targetBag[itemId]||0)+actualQty;

  document.getElementById('funds-display').textContent=state.funds.toFixed(2);
  const shopFunds=document.getElementById('shop-funds-display');
  if(shopFunds) shopFunds.textContent=state.funds.toFixed(2);
  const bagEl=document.getElementById('bag-'+itemId);
  if(bagEl) bagEl.textContent=targetBag[itemId];
  renderBagDisplay();
  if(actualQty<qty){
    addLog('Bought '+actualQty+'× '+item.name+' ($'+totalCost.toFixed(2)+') — could not afford full qty','info');
  } else {
    addLog('Bought '+actualQty+'× '+item.name+' ($'+totalCost.toFixed(2)+')','info');
  }
  // Auto-test evolution items the moment they enter the professor's bag
  if(!isTrainerItem&&(item.effect==='evolve-stone'||item.effect==='evolve-trade')){
    professorAutoTestEvolutions();
  }
  saveGame();
}

// ── POKEMON MANAGEMENT ──
function assignToAide(catchId){
  const p=state.dex.find(x=>x.id===catchId); if(!p) return;
  if(state.missionActive){ addLog('Cannot change party during a mission!','fail'); return; }
  if(state.party.length>=6){ addLog('Party is full (6 max)!','fail'); return; }
  p.holder='Carl Oak';
  state.party.push(p);
  addLog(getDisplayName(p)+' #'+p.id+' assigned to Carl Oak.','info');
  saveGame(); render();
  const m=document.getElementById('poke-modal'); if(m) m.remove();
}

function unassignPokemon(catchId){
  const p=state.dex.find(x=>x.id===catchId); if(!p) return;
  if(state.missionActive){ addLog('Cannot change party during a mission!','fail'); return; }
  p.holder=null;
  state.party=state.party.filter(x=>x.id!==catchId);
  addLog(getDisplayName(p)+' #'+p.id+' unassigned.','info');
  saveGame(); render();
  const m=document.getElementById('poke-modal'); if(m) m.remove();
}

function revivePokemon(catchId){
  if(state.funds<20){ addLog('Not enough funds to revive!','fail'); return; }
  const p=state.dex.find(x=>x.id===catchId); if(!p) return;
  state.funds=Math.round((state.funds-20)*100)/100;
  p.currentHP=p.maxHP;
  saveGame(); render();
  const m=document.getElementById('poke-modal'); if(m) m.remove();
  addLog('💊 '+getDisplayName(p)+' #'+p.id+' revived!','info');
}

function renderParty(){
  const c=document.getElementById('party-list'); c.innerHTML='';
  let spritesHtml='<div class="aide-party-sprites">';
  state.party.forEach(p=>{
    const hpPct=Math.max(0,(p.currentHP/p.maxHP)*100);
    const hpColor=hpPct>50?'#2ecc71':hpPct>20?'#f4d03f':'#e74c3c';
    const s=SPECIES[p.species];
    const gr=p.growthRate||(s?s.growthRate:null)||'mediumFast';
    const nextExp=expToLevel(p.level+1,gr);
    const curExp=expToLevel(p.level,gr);
    const ePct=nextExp>curExp?Math.min(100,Math.floor(((p.exp-curExp)/(nextExp-curExp))*100)):100;
    const fainted=p.currentHP<=0;
    const d=document.createElement('div');
    d.className='party-slot'+(fainted?' fainted':'');

// ── EVOLUTION CHAIN VISUAL (v0.22) — shared by Family Cards and Species Detail ──
function evoMethodLabel(e){
  if(e.method==='level') return 'Lv '+(e.level!=null?e.level:'?');
  if(e.method==='friendship') return 'Friendship';
  if(e.method==='friendship-day') return 'Friendship (Day)';
  if(e.method==='friendship-night') return 'Friendship (Night)';
  if(e.method==='use-item'){
    if(typeof e.item==='number'){ const it=getItem(e.item); return it?it.name:'Item'; }
    return e.item||'Item';
  }
  if(e.method==='use-move') return 'Special Move';
  return e.method||'?';
}
function evoNodeHtml(entry,isHighlight){
  const sprite=getSpriteUrl(entry.dexId,entry.name,false);
  const border=isHighlight?'border:2px solid #f4d03f;':'border:1px solid #1a4a80;';
  return '<div style="display:inline-flex;flex-direction:column;align-items:center;'+border+'border-radius:6px;padding:4px;background:#0f3460;min-width:52px;">'+
    '<img src="'+sprite+'" style="width:40px;height:40px;image-rendering:pixelated;" onerror="this.style.display=\'none\'">'+
    '<div style="font-size:8px;color:#a0a0c0;margin-top:2px;text-align:center;white-space:nowrap;">#'+entry.dexId+' '+entry.name+'</div></div>';
}
function evoPlaceholderHtml(){
  return '<div style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #333;border-radius:6px;padding:4px;background:#0a0a1a;min-width:52px;min-height:48px;">'+
    '<div style="font-size:16px;color:#555;">?</div></div>';
}
function evoArrowHtml(label){
  return '<div style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;margin:0 4px;flex-shrink:0;"><div style="color:#5dade2;font-size:12px;">→</div><div style="font-size:7px;color:#6080a0;white-space:nowrap;">'+label+'</div></div>';
}
// Root-based walk of EVO_TREE + single-target pokedex.js evolution edges. A root is any family
// member with no incoming edge from another family member. Each root gets its own row (Nidoran
// M/F -> 2 rows); a node with multiple simultaneous confirmed branches fans out with '/' in one
// row (Eevee-style). Unconfirmed nodes render as a greyed ??? placeholder, evaluated per-row.
function renderEvolutionChainVisual(famId,highlightDexId){
  const allMembers=typeof getFamilyMembers!=='undefined'?getFamilyMembers(famId):[];
  if(!allMembers.length) return '';
  const memberSet=new Set(allMembers.map(m=>m.dexId));
  const seenDexIds=new Set();
  state.dex.forEach(p=>{ if(p.pokedexId) seenDexIds.add(p.pokedexId); });
  Object.keys(state.dexHistory).forEach(id=>{ seenDexIds.add(parseInt(id)); });
  const edges=[];
  allMembers.forEach(m=>{
    if(m.evolvesIntoId&&memberSet.has(m.evolvesIntoId)){
      edges.push({from:m.dexId,to:m.evolvesIntoId,method:m.evolveMethod,level:m.evolveLevel,item:m.evolveItem});
    }
    getEvolutions(m.dexId).forEach(b=>{
      if(b.toDexId&&memberSet.has(b.toDexId)){
        edges.push({from:m.dexId,to:b.toDexId,method:b.evolveMethod,level:b.evolveLevel,item:b.evolveItem});
      }
    });
  });
  const hasIncoming=new Set(edges.map(e=>e.to));
  const roots=allMembers.filter(m=>!hasIncoming.has(m.dexId)&&seenDexIds.has(m.dexId));
  if(!roots.length) return '';
  function walk(dexId){
    const entry=allMembers.find(m=>m.dexId===dexId);
    if(!entry) return '';
    const html=evoNodeHtml(entry,dexId===highlightDexId);
    const outgoing=edges.filter(e=>e.from===dexId);
    if(!outgoing.length) return html;
    const r=state.researchLog[dexId];
    const confirmed=outgoing.filter(e=>r&&r.confirmedBranches&&r.confirmedBranches.some(b=>b.method===e.method&&b.intoId===e.to));
    if(!confirmed.length){
      if(r&&r.nonEvolutionConfirmed) return html;
      return html+evoArrowHtml('?')+evoPlaceholderHtml();
    }
    const branches=confirmed.map(e=>evoArrowHtml(evoMethodLabel(e))+walk(e.to));
    return html+branches.join('<span style="color:#5dade2;font-size:11px;margin:0 2px;align-self:center;">/</span>');
  }
  return roots.map(root=>'<div style="display:flex;align-items:flex-start;flex-wrap:wrap;gap:2px;margin:4px 0;">'+walk(root.dexId)+'</div>').join('');
}

// v0.22 — full roster, one slot per unique dexId, form-deduped identically to getFamilyMembers()
// (prefers formName:null row; true alternate forms collapse into their base slot).
function getAllSpeciesRoster(){
  if(typeof POKEDEX_DATA==='undefined') return [];
  const byDexId={};
  POKEDEX_DATA.forEach(p=>{
    const existing=byDexId[p.dexId];
    if(!existing||(existing.formName!==null&&p.formName===null)) byDexId[p.dexId]=p;
  });
  return Object.values(byDexId).sort((a,b)=>a.dexId-b.dexId);
}

    }
