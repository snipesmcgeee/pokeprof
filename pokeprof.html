function renderDexFamilies(){
  const c=document.getElementById('dex-list'); c.innerHTML='';
  if(typeof POKEDEX_DATA==='undefined'){ c.innerHTML='<div style="color:#e63946;padding:12px;font-size:11px;">Database not loaded. Check pokedex.js is in GitHub.</div>'; return; }
  const seenDexIds=new Set();
  state.dex.forEach(p=>{ if(p.pokedexId) seenDexIds.add(p.pokedexId); });
  Object.keys(state.dexHistory).forEach(id=>{ seenDexIds.add(parseInt(id)); });
  const seenFamilies=new Set();
  seenDexIds.forEach(dexId=>{ const e=getPokemonEntry(dexId); if(e&&e.familyId) seenFamilies.add(e.familyId); });
  if(!seenFamilies.size){ c.innerHTML='<div style="color:#555;padding:12px;font-size:11px;">No Pokémon discovered yet.</div>'; return; }
  [...seenFamilies].sort((a,b)=>a-b).forEach(famId=>{
    const allMembers=typeof getFamilyMembers!=='undefined'?getFamilyMembers(famId):[];
    if(!allMembers.length) return;
    const baseMember=allMembers[0];
    const liveInFamily=state.dex.filter(p=>p.pokedexId&&POKEDEX_DATA.find(x=>x.dexId===p.pokedexId&&x.familyId===famId));
    const speciesSeen=new Set(liveInFamily.map(p=>p.pokedexId));
    Object.keys(state.dexHistory).forEach(id=>{
      const dexId=parseInt(id);
      if(POKEDEX_DATA.find(x=>x.dexId===dexId&&x.familyId===famId)) speciesSeen.add(dexId);
    });
    const knownMembers=allMembers.filter(m=>speciesSeen.has(m.dexId));
    const lastKnown=knownMembers[knownMembers.length-1];
    const lastR=lastKnown?state.researchLog[lastKnown.dexId]:null;
    const allFamKnown=allMembers.every(m=>speciesSeen.has(m.dexId))&&allMembers.length>0&&(lastR&&(lastR.evolutionConfirmed||lastR.nonEvolutionConfirmed));
    const speciesDisplay=allFamKnown?speciesSeen.size+'/'+allMembers.length:speciesSeen.size+'/?';
    let totalEverCaught=0;
    speciesSeen.forEach(dexId=>{ totalEverCaught+=(state.dexHistory[dexId]||0); });
    liveInFamily.forEach(p=>{ if(!state.dexHistory[p.pokedexId]) totalEverCaught++; });
    const baseSprite=getSpriteUrl(baseMember.dexId,baseMember.name,false);
    const d=document.createElement('div');
    d.className='dex-entry'; d.style.cursor='pointer';
    d.innerHTML='<div style="display:flex;align-items:center;gap:10px;"><img src="'+baseSprite+'" style="width:48px;height:48px;image-rendering:pixelated;flex-shrink:0;" onerror="this.style.display=\'none\'"><div style="flex:1;"><div class="dex-header"><span class="dex-name">Family #'+famId+' — '+baseMember.name+' Line</span><span class="dex-id">▶</span></div><div class="dex-details">'+speciesDisplay+' species · '+totalEverCaught+' total caught</div></div></div><div onclick="event.stopPropagation()">'+renderEvolutionChainVisual(famId,null)+'</div>';
    d.onclick=()=>{ dexSelectedFamily=famId; dexView='species'; renderDex(); };
    c.appendChild(d);
  });
}

function renderDexSpecies(){
  const c=document.getElementById('dex-list'); c.innerHTML='';
  const allMembers=typeof getFamilyMembers!=='undefined'?getFamilyMembers(dexSelectedFamily):[];
  const seenDexIds=new Set(state.dex.map(p=>p.pokedexId));
  Object.keys(state.dexHistory).forEach(id=>{ seenDexIds.add(parseInt(id)); });
  const visibleMembers=allMembers.filter(m=>seenDexIds.has(m.dexId));
  if(!visibleMembers.length){ c.innerHTML='<div style="color:#555;padding:12px;font-size:11px;">No species encountered yet.</div>'; return; }
  visibleMembers.forEach(entry=>{
    const liveCount=state.dex.filter(p=>p.pokedexId===entry.dexId).length;
    const historyCount=state.dexHistory[entry.dexId]||0;
    const totalEver=Math.max(historyCount,liveCount);
    const sprite=getSpriteUrl(entry.dexId,entry.name,false);
    const d=document.createElement('div');
    d.className='dex-entry'; d.style.cursor='pointer';
    d.innerHTML='<div style="display:flex;align-items:center;gap:10px;"><img src="'+sprite+'" style="width:40px;height:40px;image-rendering:pixelated;flex-shrink:0;" onerror="this.style.display=\'none\'"><div style="flex:1;"><div class="dex-header"><span class="dex-name">#'+entry.dexId+' '+entry.name+'</span><span class="dex-id">'+totalEver+' total ('+liveCount+' held) ▶</span></div><div class="dex-details">'+(entry.type1||'???')+(entry.type2?' / '+entry.type2:'')+' · BST '+(entry.bst||'?')+'</div><div style="color:#6080a0;font-size:10px;margin-top:2px;">'+getEvolutionDisplayText(entry.dexId)+'</div></div></div>';
    d.onclick=()=>{ dexSelectedDexId=entry.dexId; dexView='detail'; renderDex(); };
    c.appendChild(d);
  });
  const lastEntry=visibleMembers[visibleMembers.length-1];
  const lastR=state.researchLog[lastEntry.dexId];
  if(!lastR||(!lastR.evolutionConfirmed&&!lastR.nonEvolutionConfirmed)){
    const ph=document.createElement('div');
    ph.className='dex-entry'; ph.style.opacity='0.45';
    ph.innerHTML='<div style="display:flex;align-items:center;gap:10px;"><div style="width:40px;height:40px;background:#0f1a2a;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#333;font-size:20px;">?</div><div><div class="dex-name" style="color:#555;">??? — Unknown</div><div class="dex-details">Further research needed</div></div></div>';
    c.appendChild(ph);
  }
}

// Builds the evolution research three-bucket HTML for a species detail page.
// Button: "X/34 Evolution Methods Tested". Expands to show ✓ Confirmed, ? Unknown, N Ruled Out.
function buildEvoMethodsHtml(dexId){
  const r=state.researchLog[dexId];
  const total=EVOLUTION_METHODS.length;
  const tested=r?r.testedMethods.length:0;

  let inner='';
  if(r&&r.nonEvolutionConfirmed){
    inner='<div style="font-size:11px;color:#5dade2;padding:4px 0;">Does not evolve</div>';
  } else {
    // Confirmed — v0.20: a species can have multiple simultaneously confirmed branches
    const confirmedMethods=(r&&r.confirmedBranches)?r.confirmedBranches.map(b=>b.method):[];
    confirmedMethods.forEach(m=>{
      inner+='<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;"><span style="color:#e0e0e0;">'+m+'</span><span style="color:#2ecc71;">✓</span></div>';
    });
    // Unknown (in enum, not yet tested)
    const unknown=EVOLUTION_METHODS.filter(m=>!r||!r.testedMethods.includes(m));
    unknown.forEach(m=>{
      inner+='<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;"><span style="color:#a0a0c0;">'+m+'</span><span style="color:#6080a0;">?</span></div>';
    });
    // Ruled out count
    const ruledOut=r?r.testedMethods.filter(m=>!confirmedMethods.includes(m)).length:0;
    if(ruledOut>0){
      inner+='<div style="font-size:10px;color:#555;margin-top:6px;padding-top:6px;border-top:1px solid #0f3460;">'+ruledOut+' Ruled Out</div>';
    }
  }

  return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid #1a4a80;">'
    +'<button onclick="toggleEvoSection(this)" style="width:100%;text-align:left;padding:6px 8px;background:#0f1a2a;border:1px solid #1a4a80;border-radius:3px;color:#5dade2;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;">'
    +'🔬 '+tested+'/'+total+' Evolution Methods Tested ▼</button>'
    +'<div style="display:none;margin-top:6px;padding:6px 8px;background:#0a1a2a;border-radius:3px;">'+inner+'</div>'
    +'</div>';
}

// v0.22 — lists locations where this species has seen>=1 in locationEncounterLog (never reveals
// unvisited-with-this-species locations, not even as ???). % is normalized from ENCOUNTERS_DATA's
// encounterRate within each (location, method) weight-group — the true table-defined odds, not
// the Map Detail Panel's empirically-observed seen-count %, which aggregates methods together
// and can't be split per-method. Multiple methods/rod-tiers at one location each get their own segment.
function buildEncounteredAtHtml(dexId){
  if(typeof ENCOUNTERS==='undefined') return '';
  const locIds=Object.keys(state.locationEncounterLog).filter(locId=>{
    const rec=state.locationEncounterLog[locId][dexId];
    return rec&&rec.seen>=1;
  });
  if(!locIds.length) return '';
  let html='<div style="margin-top:10px;padding-top:10px;border-top:1px solid #1a4a80;"><div style="color:#a0a0c0;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">Encountered At</div>';
  locIds.forEach(locId=>{
    const locData=getLocation(locId);
    const locName=locData?locData.name:locId;
    const rowsHere=ENCOUNTERS.filter(e=>e.locationId===locId&&e.dexId===dexId);
    if(!rowsHere.length) return;
    const segments=rowsHere.map(row=>{
      const method=getEncounterSubMethod(row.encounterMethod||'grass',row.requiresItem);
      const groupTotal=ENCOUNTERS.filter(e=>e.locationId===locId&&getEncounterSubMethod(e.encounterMethod||'grass',e.requiresItem)===method).reduce((a,e)=>a+(e.encounterRate||0),0);
      const pct=groupTotal>0?Math.round((row.encounterRate/groupTotal)*100):0;
      return method+' '+pct+'%';
    });
    html+='<div style="font-size:11px;color:#e0e0e0;margin-bottom:4px;"><span style="color:#5dade2;">'+locName+'</span> — '+segments.join(' · ')+'</div>';
  });
  html+='</div>';
  return html;
}

function renderDexViewAll(){
  const c=document.getElementById('dex-list'); c.innerHTML='';
  const sortEl=document.getElementById('sort-select');
  const filterEl=document.getElementById('filter-select');
  const sort=sortEl?sortEl.value:'id';
  const filter=filterEl?filterEl.value:'all';
  let entries=[...state.dex];
  if(filter==='unassigned') entries=entries.filter(p=>!p.holder);
  else if(filter==='assigned') entries=entries.filter(p=>!!p.holder);
  else if(filter==='shiny') entries=entries.filter(p=>!!p.isShiny);
  if(sort==='id') entries.sort((a,b)=>a.id-b.id);
  else if(sort==='dexid') entries.sort((a,b)=>(a.pokedexId||0)-(b.pokedexId||0));
  else if(sort==='level') entries.sort((a,b)=>b.level-a.level);
  else if(sort==='hp') entries.sort((a,b)=>b.maxHP-a.maxHP);
  else if(sort==='total') entries.sort((a,b)=>calcBST(b.species,b.level)-calcBST(a.species,a.level));
  else if(sort==='family') entries.sort((a,b)=>{
    const fa=(getPokemonEntry(a.pokedexId)||{}).familyId||0, fb=(getPokemonEntry(b.pokedexId)||{}).familyId||0;
    return fa-fb||(a.pokedexId||0)-(b.pokedexId||0);
  });
  if(!entries.length){ c.innerHTML='<div style="color:#555;padding:12px;font-size:11px;">No entries.</div>'; return; }
  entries.forEach(p=>{
    const d=document.createElement('div');
    d.className='dex-entry'+(p.holder?'':' unassigned'); d.style.cursor='pointer';
    const sprite=getSpriteUrl(p.pokedexId,p.species,p.isShiny||false);
    d.innerHTML='<div style="display:flex;align-items:center;gap:8px;"><img src="'+sprite+'" style="width:36px;height:36px;image-rendering:pixelated;flex-shrink:0;" onerror="this.style.display=\'none\'"><div style="flex:1;"><div class="dex-header"><span class="dex-name">#'+(p.pokedexId||'?')+' '+getDisplayName(p)+(p.isShiny?'<span class="shiny-badge">✨</span>':'')+' (catch #'+p.id+')</span><span class="dex-id">'+(p.holder?'👤':'📦')+'</span></div><div class="dex-details">Lv'+p.level+' · '+p.gender+' · HP '+p.currentHP+'/'+p.maxHP+' · BST '+calcBST(p.species,p.level)+'</div><div class="dex-holder">'+(p.holder?'Held by: '+p.holder:'Unassigned')+'</div></div></div>';
    d.onclick=()=>showPokemonDetail(p.id);
    c.appendChild(d);
  });
}

// ── SAVE / LOAD / RESET ──
const SAVE_KEY='pokeprof_save';
// SAVE_VERSION 13 (v0.20) — nickname + evolveBlocked fields on Pokemon objects;
// researchLog[dexId].abilitiesObserved added; researchLog[dexId].confirmedBranches[]
// replaces singular confirmedMethod/confirmedIntoId (supports branching evolutions like Eevee).
// SAVE_VERSION 14 (v0.21) — fishing splits into per-rod-tier sub-methods (fish-old/fish-good/
// fish-super) instead of a single 'fish' method. Any locationMethodPrefs entry referencing the
// old bare 'fish' method is dropped on load; that location recalculates fresh defaults on next visit.
// v0.22 stays on SAVE_VERSION 14 — no state schema changes (behavior/rendering fixes only).
const SAVE_VERSION=14;
let saveTimer=0;

function saveGame(){
  if(window._resetting) return;
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      version:SAVE_VERSION, savedAt:Date.now(), missionWasActive:state.missionActive,
      state:{
        funds:state.funds, totalCatches:state.totalCatches, totalSightings:state.totalSightings,
        missionActive:state.missionActive, missionElapsed:state.missionElapsed,
        nextEncounterIn:state.nextEncounterIn, incomeAccumulator:state.incomeAccumulator,
        dexIdCounter:state.dexIdCounter,
        currentEncounter:null, party:state.party, dex:state.dex,
        log:state.log.slice(0,50), researchLog:state.researchLog,
        missionDestination:state.missionDestination, missionBehavior:state.missionBehavior,
        missionOrigin:state.missionOrigin, currentLocation:state.currentLocation,
        autoRepeat:state.autoRepeat||false,
        professorBag:state.professorBag||{},
        trainerBag:state.trainerBag||{},
        travelPath:state.travelPath||[], travelPathIndex:state.travelPathIndex||0,
        travelCyclesRemaining:state.travelCyclesRemaining||0,
        discoveredLocations:[...state.discoveredLocations],
        locationEncounterLog:state.locationEncounterLog||{},
        locationMethodPrefs:state.locationMethodPrefs||{},
        lastHealLocation:state.lastHealLocation||'palletTown',
        dexHistory:state.dexHistory||{}
      }
    }));
    setSaveIndicator('✔ Saved','saving');
    setTimeout(()=>setSaveIndicator('⬤ Auto-save on',''),2000);
  } catch(e){ setSaveIndicator('✘ Failed','error'); }
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data) return false;

    // ── SAVE_VERSION 14 MIGRATION ──
    // Accepts v11/v12/v13 saves and migrates them; rejects anything older.
    if(data.version!==SAVE_VERSION&&data.version!==13&&data.version!==12&&data.version!==11) return false;
    const s=data.state;

    // Migrate inventory: v11 had a single `bag`; v12 splits to professorBag/trainerBag.
    let professorBag=s.professorBag||{};
    let trainerBag=s.trainerBag||{};
    if(s.bag&&Object.keys(s.bag).length&&!s.professorBag){
      Object.entries(s.bag).forEach(([itemId,qty])=>{
        const item=typeof ITEMS_DATA!=='undefined'?ITEMS_DATA.find(i=>i.itemId===itemId):null;
        const isTrainer=item&&item.bagType&&item.bagType.toLowerCase()==='trainer';
        if(isTrainer){ trainerBag[itemId]=(trainerBag[itemId]||0)+qty; }
        else { professorBag[itemId]=(professorBag[itemId]||0)+qty; }
      });
    }

    // Migrate locationEncounterLog: v11 had flat counts {[dexId]:N}; v12 uses {[dexId]:{seen,caught}}.
    const rawLog=s.locationEncounterLog||{};
    const migratedLog={};
    Object.entries(rawLog).forEach(([locId,entries])=>{
      migratedLog[locId]={};
      Object.entries(entries).forEach(([dexId,val])=>{
        if(typeof val==='number'){
          migratedLog[locId][dexId]={seen:val,caught:0};
        } else {
          migratedLog[locId][dexId]=val; // already new schema
        }
      });
    });

    Object.assign(state,{
      funds:s.funds??5, totalCatches:s.totalCatches??0, totalSightings:s.totalSightings??0,
      missionActive:s.missionActive??false, missionElapsed:s.missionElapsed??0,
      nextEncounterIn:s.nextEncounterIn??ENC_INTERVAL, incomeAccumulator:s.incomeAccumulator??0,
      dexIdCounter:s.dexIdCounter??1,
      currentEncounter:null, party:s.party??[], dex:s.dex??[], log:s.log??[],
      researchLog:s.researchLog??{}, pendingFindings:[],
      missionDestination:s.missionDestination??'route1', missionBehavior:s.missionBehavior??'research',
      missionOrigin:s.missionOrigin??'palletTown', currentLocation:s.currentLocation??'palletTown',
      autoRepeat:s.autoRepeat??false,
      professorBag, trainerBag,
      travelPath:s.travelPath??[], travelPathIndex:s.travelPathIndex??0,
      travelCyclesRemaining:s.travelCyclesRemaining??0,
      discoveredLocations:new Set(s.discoveredLocations??['palletTown','route1']),
      locationEncounterLog:migratedLog,
      locationMethodPrefs:s.locationMethodPrefs??{},
      lastHealLocation:s.lastHealLocation??'palletTown',
      dexHistory:s.dexHistory??{}
    });
    // Backfill missing fields on loaded pokemon
    state.dex.forEach(p=>{
      if(p.ability===undefined) p.ability=null;
      if(p.friendship===undefined) p.friendship=0;
      if(p.isShiny===undefined) p.isShiny=false;
      if(p.nickname===undefined) p.nickname=null; // v0.20
      if(p.evolveBlocked===undefined) p.evolveBlocked=false; // v0.20
    });
    // v0.20 migration: researchLog schema changes
    Object.keys(state.researchLog).forEach(dexIdStr=>{
      const r=state.researchLog[dexIdStr];
      if(!r) return;
      // confirmedBranches[] replaces singular confirmedMethod/confirmedIntoId
      if(!r.confirmedBranches){
        r.confirmedBranches=(r.confirmedMethod&&r.confirmedIntoId!=null)
          ?[{method:r.confirmedMethod,intoId:r.confirmedIntoId}]:[];
        delete r.confirmedMethod; delete r.confirmedIntoId;
      }
      // abilitiesObserved — best-effort backfill from currently-held individuals only;
      // cannot recover abilities from Pokemon already released before v0.20.
      if(!r.abilitiesObserved) r.abilitiesObserved={};
    });
    state.dex.forEach(p=>{ if(p.pokedexId&&p.ability) recordAbilityObserved(p.pokedexId,p.ability); });
    // v0.21 migration: fishing split into fish-old/fish-good/fish-super sub-methods.
    // Any saved location preference referencing the old bare 'fish' method is dropped entirely —
    // that location recalculates fresh defaults (all currently-unlocked methods checked evenly)
    // the next time it's visited, rather than attempting to expand/preserve the old preference.
    Object.keys(state.locationMethodPrefs).forEach(locId=>{
      const prefs=state.locationMethodPrefs[locId];
      if(prefs&&prefs.methods&&prefs.methods.includes('fish')){
        delete state.locationMethodPrefs[locId];
      }
    });
    // Backfill dexHistory from live dex for pre-v11 saves
    if(!s.dexHistory){
      state.dex.forEach(p=>{
        if(p.pokedexId) state.dexHistory[p.pokedexId]=(state.dexHistory[p.pokedexId]||0)+1;
      });
    }
    // Re-link party entries to their canonical dex objects by id
    // JSON parse breaks shared references — do not remove this line
    state.party = state.party.map(pp => state.dex.find(d => d.id === pp.id) || pp);
    // v0.22 — retroactive method rule-out: catches up any existing save's individuals that
    // already exceed the level/friendship rule-out thresholds, not just ones going forward.
    state.dex.forEach(p=>{ checkMethodRuleOut(p.pokedexId,p.level,p.friendship); });
    const secsAway=Math.floor((Date.now()-data.savedAt)/1000);
    let offSum=null;
    if(secsAway>10&&data.missionWasActive) offSum=processOfflineTime(secsAway);
    const logEl=document.getElementById('log'); logEl.innerHTML='';
    [...state.log].reverse().forEach(e=>{
      const d=document.createElement('div');
      d.className='log-entry '+(e.type||'');
      d.textContent=e.msg;
      logEl.appendChild(d);
    });
    document.getElementById('funds-display').textContent=state.funds.toFixed(2);
    document.getElementById('total-catches').textContent=state.totalCatches;
    document.getElementById('total-sightings').textContent=state.totalSightings;
    document.getElementById('btn-recall').disabled=!state.missionActive;
    document.getElementById('btn-start').disabled=state.missionActive;
    const t=new Date(data.savedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    setSaveIndicator('⬤ Loaded ('+t+')','saving');
    setTimeout(()=>setSaveIndicator('⬤ Auto-save on',''),3000);
    if(offSum) showOfflineBanner(secsAway,offSum);
    return true;
  } catch(e){ setSaveIndicator('✘ Load error','error'); return false; }
}

function resetGame(){
  if(!confirm('Wipe ALL progress? This cannot be undone.')) return;
  clearInterval(window._gameTickInterval);
  clearInterval(window._autoSaveInterval);
  window._resetting=true;
  localStorage.clear();
  location.reload();
}

function setSaveIndicator(msg,cls){
  const el=document.getElementById('save-indicator');
  el.textContent=msg; el.className=cls||'';
}

function autoSaveTick(){ saveTimer++; if(saveTimer>=30){ saveTimer=0; saveGame(); } }

function init(){
  const s=makePokemon('Rattata',5,Math.random()<0.5?'M':'F','Carl Oak');
  state.party.push(s); state.dex.push(s);
  state.dexHistory[s.pokedexId]=(state.dexHistory[s.pokedexId]||0)+1;
  recordNewSpecies(s.pokedexId,'Rattata');
  recordSighting(s.pokedexId,5);
  addLog('Rattata #1 added to party as starter.','info');
  render();
}

// ── BOOT ──
const hasSave=loadGame();
if(!hasSave){
  const initDiscovered=new Set(['palletTown']);
  if(typeof CONNECTIONS_DATA!=='undefined'){
    (CONNECTIONS_DATA||[]).forEach(c=>{
      if(c.fromLocationId==='palletTown') initDiscovered.add(c.toLocationId);
    });
  } else {
    initDiscovered.add('route1');
  }
  state={
    funds:5.00, totalCatches:0, totalSightings:0,
    missionActive:false, missionElapsed:0, nextEncounterIn:ENC_INTERVAL,
    incomeAccumulator:0,
    party:[], dex:[], dexIdCounter:1, currentEncounter:null, log:[],
    missionDestination:'route1', missionBehavior:'research',
    missionOrigin:'palletTown', currentLocation:'palletTown', autoRepeat:false,
    travelPath:[], travelPathIndex:0, travelCyclesRemaining:0,
    professorBag:{}, trainerBag:{},
    researchLog:{}, pendingFindings:[],
    discoveredLocations:initDiscovered,
    locationEncounterLog:{},
    locationMethodPrefs:{},
    lastHealLocation:'palletTown',
    dexHistory:{}
  };
  init();
  setSaveIndicator('⬤ New game','');
} else {
  render();
}

// ── MAP SYSTEM ──
// Node color derived functionally from heals/shopTier — no separate locationType field.
// Locations with a shopTier render as city-style (green); heal-only locations as town-style
// (red); everything else (routes, dungeons) as route-style (blue). This is a deliberate
// simplification versus the old hardcoded type map, which had a fourth "dungeon" (purple)
// category with no equivalent in the Locations data — flagged for awareness, not a bug.
const MAP_COLORS = {
  city:  {fill:'#0f3460', stroke:'#2ecc71', label:'#2ecc71'},
  town:  {fill:'#16213e', stroke:'#e63946', label:'#e0e0e0'},
  route: {fill:'#0a1a2a', stroke:'#5dade2', label:'#a0c4ff'},
};
function getMapNodeStyle(locData){
  if(locData&&locData.shopTier) return MAP_COLORS.city;
  if(locData&&(locData.heals===true||locData.heals==='TRUE'||locData.heals==='true')) return MAP_COLORS.town;
  return MAP_COLORS.route;
}

let mapSelectedLoc = null;

function renderMap(){
  const svg=document.getElementById('map-svg');
  if(!svg) return;
  svg.innerHTML='';

  const discovered=[...state.discoveredLocations];
  if(!discovered.length){ svg.innerHTML='<text x="50%" y="50%" text-anchor="middle" fill="#555" font-size="12">No locations discovered yet.</text>'; return; }

  const visibleKeys=discovered.filter(id=>{ const l=getLocation(id); return l&&l.mapCol!=null&&l.mapRow!=null; });
  if(!visibleKeys.length){ svg.innerHTML='<text x="50%" y="50%" text-anchor="middle" fill="#555" font-size="12" font-family="monospace">Map data for these locations coming soon.</text>'; return; }

  const cols=visibleKeys.map(k=>getLocation(k).mapCol);
  const rows=visibleKeys.map(k=>getLocation(k).mapRow);
  const minCol=Math.min(...cols), maxCol=Math.max(...cols);
  const minRow=Math.min(...rows), maxRow=Math.max(...rows);

  // Dynamic viewBox computed from discovered node extents — never a fixed grid
  const CELL=72, PAD=48;
  const gridW=(maxCol-minCol)*CELL+PAD*2;
  const gridH=(maxRow-minRow)*CELL+PAD*2;
  svg.setAttribute('viewBox','0 0 '+gridW+' '+gridH);

  function nodeX(k){ return (getLocation(k).mapCol-minCol)*CELL+PAD; }
  function nodeY(k){ return (getLocation(k).mapRow-minRow)*CELL+PAD; }

  if(typeof CONNECTIONS_DATA!=='undefined'){
    const drawn=new Set();
    (CONNECTIONS_DATA||[]).forEach(conn=>{
      const key=([conn.fromLocationId,conn.toLocationId].sort().join('|'));
      if(drawn.has(key)) return;
      if(!state.discoveredLocations.has(conn.fromLocationId)||!state.discoveredLocations.has(conn.toLocationId)) return;
      const fromLoc=getLocation(conn.fromLocationId), toLoc=getLocation(conn.toLocationId);
      if(!fromLoc||fromLoc.mapCol==null||fromLoc.mapRow==null) return;
      if(!toLoc||toLoc.mapCol==null||toLoc.mapRow==null) return;
      drawn.add(key);
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',nodeX(conn.fromLocationId));
      line.setAttribute('y1',nodeY(conn.fromLocationId));
      line.setAttribute('x2',nodeX(conn.toLocationId));
      line.setAttribute('y2',nodeY(conn.toLocationId));
      line.setAttribute('stroke',conn.requiresItem?'#9b59b6':'#1a4a80');
      line.setAttribute('stroke-width','2');
      if(conn.requiresItem) line.setAttribute('stroke-dasharray','4,4');
      svg.appendChild(line);
    });
  }

  visibleKeys.forEach(locId=>{
    const locData=getLocation(locId);
    const c=getMapNodeStyle(locData);
    const x=nodeX(locId), y=nodeY(locId);
    const isCurrent=state.currentLocation===locId;
    const isSelected=mapSelectedLoc===locId;

    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor='pointer';

    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',x); circle.setAttribute('cy',y); circle.setAttribute('r','14');
    circle.setAttribute('fill',isCurrent?'#1a3a5a':c.fill);
    circle.setAttribute('stroke',isSelected?'#f4d03f':c.stroke);
    circle.setAttribute('stroke-width',isSelected?'3':'2');
    g.appendChild(circle);

    if(isCurrent){
      const carl=document.createElementNS('http://www.w3.org/2000/svg','text');
      carl.setAttribute('x',x); carl.setAttribute('y',y+5);
      carl.setAttribute('text-anchor','middle'); carl.setAttribute('font-size','12');
      carl.textContent='🧑';
      g.appendChild(carl);
    }

    const text=document.createElementNS('http://www.w3.org/2000/svg','text');
    // v0.22: stagger label y-offset by column parity to reduce adjacent-column overlap.
    // Even columns keep the original offset; odd columns get 12px extra. No connector line.
    const labelYOffset=((locData.mapCol||0)%2===0)?26:38;
    text.setAttribute('x',x); text.setAttribute('y',y+labelYOffset);
    text.setAttribute('text-anchor','middle');
    text.setAttribute('font-size','9');
    text.setAttribute('font-family','Courier New, monospace');
    text.setAttribute('fill',isCurrent?'#f4d03f':c.label);
    text.setAttribute('pointer-events','none');
    text.textContent=locData.name||locId;
    g.appendChild(text);

    g.onclick=(e)=>{ e.stopPropagation(); selectMapLocation(locId); };
    svg.appendChild(g);
  });
}

function handleMapClick(e){
  if(e.target===document.getElementById('map-svg')){
    mapSelectedLoc=null;
    document.getElementById('map-detail').style.display='none';
    renderMap();
  }
}

function selectMapLocation(locId){
  mapSelectedLoc=locId;
  renderMap();
  showMapDetail(locId);
}

function showMapDetail(locId){
  const detail=document.getElementById('map-detail');
  const content=document.getElementById('map-detail-content');
  const locData=typeof LOCATIONS!=='undefined'?getLocation(locId):null;
  const locName=locData?locData.name:locId;

  const encLog=state.locationEncounterLog[locId]||{};
  const totalEncs=Object.values(encLog).reduce((a,b)=>a+(b.seen||0),0);

  let encHtml='';
  if(totalEncs>0){
    const sorted=Object.entries(encLog).sort((a,b)=>(b[1].seen||0)-(a[1].seen||0));
    encHtml='<div style="color:#a0a0c0;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin:10px 0 6px;">Observed Encounters ('+totalEncs+' total)</div>';
    encHtml+='<div style="display:flex;flex-direction:column;gap:4px;">';
    sorted.forEach(([dexIdStr,counts])=>{
      const dexId=parseInt(dexIdStr);
      const pEntry=getPokemonEntry(dexId);
      const name=pEntry?pEntry.name:'#'+dexId;
      const sprite=getSpriteUrl(dexId,name,false);
      const seenCount=counts.seen||0;
      const caughtCount=counts.caught||0;
      const pct=Math.round((seenCount/totalEncs)*100);
      const encDb=typeof ENCOUNTERS!=='undefined'?ENCOUNTERS.filter(e=>e.locationId===locId&&e.dexId===dexId):[];
      const minLv=encDb.length?Math.min(...encDb.map(e=>e.minLevel)):'?';
      const maxLv=encDb.length?Math.max(...encDb.map(e=>e.maxLevel)):'?';
      const methods=[...new Set(encDb.map(e=>e.encounterMethod).filter(Boolean))].join(', ')||'?';
      encHtml+='<div style="display:flex;align-items:center;gap:8px;background:#0f1a2a;padding:6px 8px;border-radius:4px;"><img src="'+sprite+'" style="width:48px;height:48px;image-rendering:pixelated;flex-shrink:0;" onerror="this.style.display=\'none\'"><div style="flex:1;"><div style="color:#fff;font-size:11px;font-weight:bold;">'+name+'</div><div style="color:#a0a0c0;font-size:10px;">Lv '+minLv+'–'+maxLv+' · '+methods+'</div><div style="margin-top:3px;background:#0a0a1a;border-radius:2px;height:5px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:#5dade2;border-radius:2px;"></div></div><div style="color:#5dade2;font-size:10px;margin-top:1px;">'+pct+'% ('+seenCount+' seen, '+caughtCount+' caught)</div></div></div>';
    });
    encHtml+='</div>';
  } else {
    encHtml='<div style="color:#555;font-size:11px;margin-top:8px;">No encounters recorded here yet.</div>';
  }

  const heals=locData&&(locData.heals===true||locData.heals==='TRUE'||locData.heals==='true');
  const shop=locData&&locData.shopTier;
  const isCurrent=state.currentLocation===locId;

  content.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;"><div><div style="color:#e0e0e0;font-size:13px;font-weight:bold;">'+locName+'</div><div style="color:#6080a0;font-size:10px;">'+(locData?locData.region||'Kanto':'Kanto')+'</div></div><div style="text-align:right;font-size:10px;">'+(isCurrent?'<span style="color:#f4d03f;">📍 Carl is here</span><br>':'')+(heals?'<span style="color:#2ecc71;">🏥 Heals party</span><br>':'')+(shop?'<span style="color:#f4d03f;">🛒 Shop: '+shop+'</span>':'')+'</div></div>'+encHtml;

  detail.style.display='block';
}

// ── LOCATION HELPERS ──
function getLocation(locId){
  if(typeof LOCATIONS==='undefined') return null;
  return LOCATIONS.find?LOCATIONS.find(l=>l.locationId===locId):LOCATIONS[locId]||null;
}

function getShopItems(locId){
  if(typeof ITEMS_DATA==='undefined') return [];
  const loc=getLocation(locId);
  if(!loc||!loc.shopTier) return [];
  return ITEMS_DATA.filter(i=>i.shopTier&&i.shopTier<=loc.shopTier&&i.shopPrice);
}

// Boot intervals — set AFTER loadGame/init completes, never inside confirmMission
window._autoSaveInterval=setInterval(autoSaveTick,1000);
window._gameTickInterval=setInterval(gameTick,1000);

let _hiddenAt=null;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    _hiddenAt=Date.now();
    saveGame();
  } else {
    if(_hiddenAt&&state.missionActive){
      const secsAway=Math.floor((Date.now()-_hiddenAt)/1000);
      if(secsAway>5){
        const summary=processOfflineTime(secsAway);
        if(summary&&(summary.encounters>0||summary.income>0)) showOfflineBanner(secsAway,summary);
        render(); saveGame();
      }
    }
    _hiddenAt=null;
  }
});
</script>
